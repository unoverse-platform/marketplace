$schema: ../../_schema/credential.schema.json

name: unstructuredCredential
displayName: Unstructured
description: Unstructured API key for document parsing
documentationUrl: https://docs.unstructured.io/api-reference/partition/overview

properties:
  - name: apiKey
    displayName: API Key
    type: string
    required: true
    secret: true
    description: Your Unstructured API key
  - name: apiUrl
    displayName: API URL
    type: string
    required: false
    secret: false
    # NOT cosmetic. Unstructured's docs say to "use the URL that was provided to you when your account
    # was created" — a serverless account gets its own host, and self-hosting gets another entirely.
    # Defaulting silently to the shared host would send documents somewhere the account may not intend.
    description: >-
      Override the API host. Use the URL Unstructured gave you, or your own if self-hosting. Defaults to
      https://api.unstructuredapp.io
    placeholder: https://api.unstructuredapp.io
