configSchema:
  type: object
  required: [model, prompt]
  properties:
    model:
      type: string
      title: Model
      description: Which Gemini image model to generate with
      enum:
        - gemini-3-pro-image
        - gemini-3.1-flash-image
        - gemini-3.1-flash-lite-image
      enumNames:
        - Gemini 3 Pro Image (Nano Banana Pro), best quality
        - Gemini 3.1 Flash Image (Nano Banana 2), the all-rounder
        - Gemini 3.1 Flash Lite Image (Nano Banana 2 Lite), fastest and cheapest
      default: gemini-3.1-flash-image
    prompt:
      type: string
      title: Image Prompt
      description: Describe the image to generate. Shared blocks work here, e.g. {{prompt.geminiLikenessPreface}}.
      default: ""
      "ui:field": template
      "ui:ai":
        editable: true
    fileName:
      type: string
      title: File Name Prefix
      description: Prefixes each generated file name, which is then numbered and given an extension
      default: generated_image
      "ui:field": template
    referenceImageUrl:
      type: string
      title: Reference Image URL
      description: >-
        A photo to take facial likeness from. Leave empty to generate from the prompt alone.
        When set, the model is told the photo is a casting reference and the prompt still
        directs the scene.
      default: ""
      "ui:field": template
    guideImageUrls:
      type: string
      title: Guide Images
      description: >-
        Up to four images, one URL per line, that the prompt directs: a character sheet, an
        approved scene, a style to match. They reach the model as Image 1, Image 2 and so on,
        in this order, with no instruction of their own, so the prompt says what each is for
        ("keep the character in Image 1 exactly; keep the layout of Image 2; change only...").
        Leave empty to generate from the prompt alone.
      default: ""
      "ui:field": template
"ui:order": [model, prompt, fileName, referenceImageUrl, guideImageUrls]
