$schema: ../../../_schema/test.schema.json

# BOTH, so the fixture exercises the two calls and the skip logic in one run.
#
# The text is deliberately dense with things each model should find and the other should not:
# a name and an age for PHI, conditions and dosed medications for entities. Asserts the
# SHAPE and that both models found something, never the specific entities, because the model
# version moves and a fixture pinned to exact findings fails on an upgrade that improved it.

testData:
  config:
    text: >-
      Ada Lovelace, 45, presents with substernal chest pain radiating to the left arm.
      History of hypertension and type 2 diabetes. Currently taking Lisinopril 10mg daily
      and Metformin 500mg BID. BP 150/95, HR 88. EKG shows ST elevation.
    analysisType: BOTH
  inputs:
    text: ""
  expect:
    result: >-
      return output.result.entities.length > 0
        && output.result.phi.length > 0
        && output.result.metadata.entityCount === output.result.entities.length
        && output.result.modelVersion.length > 0
