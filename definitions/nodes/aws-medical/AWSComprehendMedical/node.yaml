$schema: ../../../_schema/node.schema.json

type: AWSComprehendMedical
kind: PromiseNode

name: AWS Comprehend Medical
category: Documents
color: "#FF9900"

description: Extract medical entities and PHI from clinical text

whenToUse: >-
  Pick to pull structured medical facts out of clinical text: conditions, medications,
  dosages, anatomy, test results, and the protected health information in it. Trained on
  clinical language, so it reads an OCR'd chart or a transcribed dictation correctly and is
  wasted on ordinary prose, where general entity extraction does better. English only, and
  one document of under 20,000 bytes per run.

# WHO MAY RUN THIS (DECLARATIVE_NODES.md §9.13). Compulsory on every node, so that a node
# nobody thought about cannot look the same as one deliberately left open.
#
# `required: false` adds no requirement of its own: the node runs for whoever the trigger
# admitted. The trigger instance's publicEntry toggle still owns the door, and requirements
# only ever narrow.
auth:
  required: false

capabilities:
  # NOT cacheable. Extraction over the same text IS deterministic, but the model version
  # moves underneath it and a clinical result that silently came from an older model is
  # worse than paying for the call again.
  cacheable: false
