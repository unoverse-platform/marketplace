# One row per output connector, in interface.yaml order.
#
# Reads `calls.*` rather than `response`, because either call may have been skipped and the
# LAST reply is not reliably the one wanted. A skipped call leaves no key, so the spreads
# below omit `entities` or `phi` entirely, exactly as the retired node did.
#
# `metadata.processingTime` did not come back. The expression sandbox has one clock reading
# and no way to hold a start time across two calls, so a wall-clock duration cannot be
# computed here. It was a log line dressed as data.

- emit: result
  from: response
  value: >-
    return {
      ...(calls.entities ? { entities: calls.entities.Entities || [] } : {}),
      ...(calls.phi ? { phi: calls.phi.Entities || [] } : {}),
      modelVersion: (calls.entities || calls.phi || {}).ModelVersion || '',
      metadata: {
        textLength: String(config.text || '').length,
        entityCount: ((calls.entities || {}).Entities || []).length,
        phiCount: ((calls.phi || {}).Entities || []).length,
      },
    }
