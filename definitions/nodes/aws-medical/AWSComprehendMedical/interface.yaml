$schema: ../../../_schema/interface.schema.json

inputs:
  # NAMED `text`, not `signal`, because the retired node named it that and saved workflows
  # hold edges into a port of that name. Renaming it would silently orphan them.
  - name: text
    type: string
    description: Clinical text to analyse. Reference it from the Clinical Text setting.
    required: false

outputs:
  - name: result
    type: object
    description: >-
      { entities, phi, modelVersion, metadata }. `entities` and `phi` are each present only
      when the analysis type asked for them, and each entry carries its category, type,
      traits, character offsets and confidence score.

credentials:
  - name: awsCredential
    required: true
    displayName: AWS
