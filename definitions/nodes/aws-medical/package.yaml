$schema: ../_schema/package.schema.json

# COMPREHEND MEDICAL AS A MANIFEST. The cheapest AWS package left after Bedrock, because
# both operations it uses are plain signed JSON POSTs against one regional endpoint, and the
# signer already existed.
#
# Three legacy config fields did NOT come back, and none of them is a capability gap:
#
#   outputFormat   json | simplified | both. Declared, offered in the form, and never read
#                  by a line of the service. Every run returned raw entities whatever it was
#                  set to. Porting it would have preserved a setting that does nothing.
#   language       The only value was `en`, and DetectEntitiesV2 takes no language parameter
#                  at all. Comprehend Medical is English-only, so the field could not have
#                  had an effect.
#   saveToS3       Wrote the result to `process.env.GRAVITY_S3_BUCKET`, falling back to a
#                  hard-coded `gravity-default-bucket`. A manifest cannot read the
#                  environment, and it should not: writing an object to S3 is what the S3
#                  nodes do, so this composes as an edge rather than hiding inside an
#                  extraction node. The `outputKey` output went with it.
#
# The retired TypeScript is at `_legacy/nodes/aws-medical/`.

name: aws-medical
displayName: AWS Comprehend Medical
description: Extract medical entities and PHI from clinical text
version: 2.0.0
category: ai
logoUrl: https://res.cloudinary.com/sonik/image/upload/v1755603269/gravity/icons/ComprehendMedical.png

features:
  - Medical entity extraction from clinical text
  - PHI detection, for redaction upstream of anything that stores the text
  - Entity categories, traits and confidence scores

# Two labels deep: comprehendmedical.eu-west-1.amazonaws.com.
allowedHosts:
  - "**.amazonaws.com"

requires:
  credential: [awsSigV4]
  transport: [json]
  executorVersion: ">=1.4.0"
