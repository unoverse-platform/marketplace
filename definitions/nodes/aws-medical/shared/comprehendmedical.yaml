# The one call shape both Comprehend Medical operations share.
#
# Like DynamoDB and unlike Bedrock, this is RPC over one endpoint: everything POSTs to the
# regional host and `X-Amz-Target` picks the operation. A node $refs this and adds that
# header plus a body.
#
# `comprehendmedical` is the signing name AND the endpoint prefix, one word with no
# separator. The console calls the service "Comprehend Medical" and a sibling service is
# plain `comprehend`; signing against either spelling is a 403 that says nothing about
# which part was wrong.

call: &call
  method: POST
  url: >-
    return 'https://comprehendmedical.'
      + (credentials.awsCredential.region || 'us-east-1') + '.amazonaws.com/'

  credential:
    scheme: awsSigV4
    service: comprehendmedical

  headers:
    # 1.1, NOT the 1.0 DynamoDB speaks. AWS's JSON dialects are per service and the wrong
    # one is a 400 complaining about the body rather than the header.
    Content-Type: application/x-amz-json-1.1

  transport: json

  retry:
    attempts: 3
    backoff: exponential
    # Comprehend Medical reports throttling as a 400 (TooManyRequestsException), and so does
    # ServiceUnavailableException, which is documented as a 400 despite the name. Retrying
    # 400 as a class would resend genuinely malformed and oversized text forever, so only
    # the server-side statuses retry and a throughput limit surfaces as a failure the author
    # can see.
    on: [500, 502, 503, 504]
