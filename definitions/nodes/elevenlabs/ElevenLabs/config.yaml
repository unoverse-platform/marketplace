$schema: ../../../_schema/config.schema.json

# `characterId` and `characterGender` are GONE. They fed the retired multi-speaker compat path — see
# package.yaml — and nothing in apps/ sets them.

configSchema:
  type: object
  required: [text]
  properties:
    text:
      type: string
      title: Text
      description: The words to speak.
      default: "{{{input}}}"
      "ui:field": template
    voiceId:
      type: string
      title: Voice ID
      description: >-
        Any voice id from your ElevenLabs library. Leave blank for a default narrator voice — the same
        premade voice the code version fell back to, so an unset field keeps working.
      default: ""
    modelId:
      type: string
      title: Model
      description: Override the TTS model. Leave blank for the package default.
      default: ""
    stability:
      type: number
      title: Stability
      description: >-
        0 is most expressive, 0.5 natural, 1 most consistent. ElevenLabs accepts ONLY these three values
        on this model, so anything else falls back to 0.5.
      enum: [0.0, 0.5, 1.0]
      enumNames: ["0 — expressive", "0.5 — natural", "1 — consistent"]
      default: 0.5
    outputFormat:
      type: string
      title: Output Format
      description: Audio encoding, e.g. mp3_44100_128. Leave blank for the account default.
      default: ""

    # WHO MAY RUN THIS BOX, set by whoever builds the workflow (15-who-can-run-it.md).
    #
    # INSTANCE config, not the manifest's `auth`, and the two answer different questions.
    # The manifest is the node author's FLOOR: "this node is inherently privileged". These
    # are the builder's, per box on the canvas, because the same node type legitimately
    # faces staff on one workflow and customers on another.
    #
    # A role especially has to live here: `finance:approve` is a claim THIS deployment's
    # identity provider mints, and a node published to the marketplace cannot know the role
    # vocabulary of every universe that installs it.
    #
    # The executor takes the STRICTER of the two. Neither can loosen the other.
    authRequired:
      type: boolean
      title: Require sign-in
      description: Only signed-in callers can run this step.
      default: false
      "ui:widget": toggle
    authRole:
      type: string
      title: Require role
      description: A claim the caller must carry, like finance:approve.
      default: ""
      "ui:dependencies": { authRequired: true }

"ui:order": [authRequired, authRole, text, voiceId, stability, modelId, outputFormat]
