type: ElevenLabsDialogue
kind: PromiseNode

name: ElevenLabs Dialogue
category: Media & Design
color: "#FF69B4"
logoUrl: https://res.cloudinary.com/sonik/image/upload/v1768540562/gravity/icons/elevanlabs.jpg

description: Perform a multi-speaker script as one audio clip. Outputs base64 MP3.

whenToUse: >-
  Perform a SCRIPT with several speakers as a single clip, with the turn-taking and interruptions of real
  conversation. Give it lines with a voice each. Use it over TTS whenever more than one person speaks,
  because TTS reads everything in one voice.

# WHO MAY RUN THIS (DECLARATIVE_NODES.md §9.13). Compulsory on every node, so that a node
# nobody thought about cannot look the same as one deliberately left open.
#
# `required: false` adds no requirement of its own: the node runs for whoever the trigger
# admitted. The trigger instance's publicEntry toggle still owns the door, and requirements
# only ever narrow.
auth:
  required: false

capabilities:
  cacheable: false
