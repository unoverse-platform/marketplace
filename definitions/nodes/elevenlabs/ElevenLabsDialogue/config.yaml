$schema: ../../../_schema/config.schema.json

configSchema:
  type: object
  required: [lines]
  properties:
    lines:
      type: object
      title: Lines
      description: >-
        Array of { text, voiceId }, or { text, speaker } with the speaker named in Voice Map. Usually
        wired in from an upstream node as an expression, e.g. return signal.script1.lines
      # NO DEFAULT. An object-typed template field takes a `return ...` expression rather than
      # handlebars (06-config-schema.md), and there is no expression that generically names "whatever is
      # wired to my lines port" — a signal is keyed by SOURCE NODE. So the author writes it, and lint
      # keeps the field honest instead of shipping a default that resolves to nothing.
      "ui:field": template
    voiceMap:
      type: object
      title: Voice Map
      description: >-
        Maps a speaker name to a voice id, e.g. { "NARRATOR": "onwK...", "GUEST": "pNIn..." }. Only needed
        for lines that name a `speaker` instead of carrying their own voiceId.
      "ui:field": template
    modelId:
      type: string
      title: Model
      description: Override the dialogue model. Leave blank for the package default.
      default: ""
    stability:
      type: number
      title: Stability
      description: 0 is most expressive, 0.5 natural, 1 most consistent. Only these three are accepted.
      enum: [0.0, 0.5, 1.0]
      enumNames: ["0 — expressive", "0.5 — natural", "1 — consistent"]
      default: 0.5

    # WHO MAY RUN THIS BOX, set by whoever builds the workflow (15-who-can-run-it.md).
    #
    # INSTANCE config, not the manifest's `auth`, and the two answer different questions.
    # The manifest is the node author's FLOOR: "this node is inherently privileged". These
    # are the builder's, per box on the canvas, because the same node type legitimately
    # faces staff on one workflow and customers on another.
    #
    # A role especially has to live here: `finance:approve` is a claim THIS deployment's
    # identity provider mints, and a node published to the marketplace cannot know the role
    # vocabulary of every universe that installs it.
    #
    # The executor takes the STRICTER of the two. Neither can loosen the other.
    authRequired:
      type: boolean
      title: Require sign-in
      description: >-
        Only a signed-in caller may run this step. Leave off and it runs for whoever the
        workflow's trigger admitted, which is the usual answer.
      default: false
      "ui:widget": toggle
    authRole:
      type: string
      title: Require role
      description: >-
        A claim the caller's account must carry, as noun:verb (finance:approve,
        payments:refund). Leave blank to require only that they are signed in.
      default: ""
      "ui:dependencies": { authRequired: true }

"ui:order": [lines, voiceMap, stability, modelId, authRequired, authRole]
