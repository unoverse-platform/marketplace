configSchema:
  type: object
  required: [lines]
  properties:
    lines:
      type: object
      title: Lines
      description: >-
        Array of { text, voiceId }, or { text, speaker } with the speaker named in Voice Map. Usually
        wired in from an upstream node as an expression, e.g. return signal.script1.lines
      # NO DEFAULT. An object-typed template field takes a `return ...` expression rather than
      # handlebars (06-config-schema.md), and there is no expression that generically names "whatever is
      # wired to my lines port" — a signal is keyed by SOURCE NODE. So the author writes it, and lint
      # keeps the field honest instead of shipping a default that resolves to nothing.
      "ui:field": template
    voiceMap:
      type: object
      title: Voice Map
      description: >-
        Maps a speaker name to a voice id, e.g. { "NARRATOR": "onwK...", "GUEST": "pNIn..." }. Only needed
        for lines that name a `speaker` instead of carrying their own voiceId.
      "ui:field": template
    modelId:
      type: string
      title: Model
      description: Override the dialogue model. Leave blank for the package default.
      default: ""
    stability:
      type: number
      title: Stability
      description: 0 is most expressive, 0.5 natural, 1 most consistent. Only these three are accepted.
      enum: [0.0, 0.5, 1.0]
      enumNames: ["0 — expressive", "0.5 — natural", "1 — consistent"]
      default: 0.5
"ui:order": [lines, voiceMap, stability, modelId]
