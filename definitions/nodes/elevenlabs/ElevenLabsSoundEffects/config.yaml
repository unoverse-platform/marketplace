$schema: ../../../_schema/config.schema.json

configSchema:
  type: object
  required: [text]
  properties:
    text:
      type: string
      title: Prompt
      description: Describe the sound effect, e.g. "heavy wooden door slamming shut in a stone corridor".
      default: "{{{input}}}"
      "ui:field": template
    durationSeconds:
      type: number
      title: Duration (seconds)
      description: 0.5 to 30. Leave blank to let the model choose the optimal length.
      minimum: 0.5
      maximum: 30
    promptInfluence:
      type: number
      title: Prompt Influence
      description: 0 is more creative, 1 follows the prompt strictly. Default 0.3.
      minimum: 0
      maximum: 1
      default: 0.3
    outputFormat:
      type: string
      title: Output Format
      description: >-
        Audio encoding, e.g. mp3_44100_128. Leave blank for the account default — the service passed it
        only when set, and naming a format your plan disallows is a 400.
      default: ""
    loop:
      type: boolean
      title: Loopable
      description: Generate a seamless looping clip (v2 model)
      default: false
      "ui:widget": toggle

    # WHO MAY RUN THIS BOX, set by whoever builds the workflow (15-who-can-run-it.md).
    #
    # INSTANCE config, not the manifest's `auth`, and the two answer different questions.
    # The manifest is the node author's FLOOR: "this node is inherently privileged". These
    # are the builder's, per box on the canvas, because the same node type legitimately
    # faces staff on one workflow and customers on another.
    #
    # A role especially has to live here: `finance:approve` is a claim THIS deployment's
    # identity provider mints, and a node published to the marketplace cannot know the role
    # vocabulary of every universe that installs it.
    #
    # The executor takes the STRICTER of the two. Neither can loosen the other.
    authRequired:
      type: boolean
      title: Require sign-in
      description: >-
        Only a signed-in caller may run this step. Leave off and it runs for whoever the
        workflow's trigger admitted, which is the usual answer.
      default: false
      "ui:widget": toggle
    authRole:
      type: string
      title: Require role
      description: >-
        A claim the caller's account must carry, as noun:verb (finance:approve,
        payments:refund). Leave blank to require only that they are signed in.
      default: ""
      "ui:dependencies": { authRequired: true }

"ui:order": [text, durationSeconds, promptInfluence, outputFormat, loop, authRequired, authRole]
