$schema: ../../../_schema/node.schema.json

# Transcribed from src/OpenAIStructuredOutput/node/index.ts.

type: OpenAIStructuredOutput
kind: PromiseNode

name: GPT-5 Structured Output
category: AI
color: "#2F6F66"

description: Extract structured data using the GPT-5 Responses API with a JSON schema

# Wiring moved out of the middle to the end, per doc 14: mechanism last.
whenToUse: >-
  Pick when the output must be JSON that strictly matches a schema, so downstream nodes can
  rely on the shape instead of parsing defensively: schema-enforced extraction and
  structuring. Free-form prose or multi-turn tool use makes it the wrong, over-constrained
  choice. Wire the schema and the content in as inputs.

capabilities:
  # An extraction is a model call, so it is non-deterministic. Re-running is correct.
  cacheable: false
