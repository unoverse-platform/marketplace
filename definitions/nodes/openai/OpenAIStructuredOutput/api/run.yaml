- name: generate
  method: POST
  url: { $ref: endpoints#responses }

  credential:
    scheme: bearer
    token: "{{ credentials.openAICredential.apiKey }}"

  # An EXPRESSION body, because `input` changes SHAPE with the content. Text goes
  # straight through; an image becomes a two-part array of input_image + input_text;
  # anything else is stringified. Templates interpolate values, they cannot branch on
  # structure. Transcribed from src/OpenAIStructuredOutput/service/structuredOutput.ts.
  #
  # `content` and `schema` are CONFIG, resolved by the engine from the one `signal` input
  # before this runs, so the call always has both (signal-routing.md, "Two inputs never
  # arrive together"). One node serves every extraction shape because the schema is a field.
  #
  # A CALL CANNOT RUN AWAY (owner, 2026-09-12, after a stalled schema billed about $100 of
  # output in two days): `max_output_tokens` is a ceiling, 16000, over twice the largest
  # answer any extraction has written (7000). A stuck model stops there, its reply says
  # "incomplete" and carries its usage, so the spend is also in the token log; a call cut
  # off by the timeout instead is billed and never counted.
  body: >-
    return {
      model: config.model,
      instructions: config.instructions,
      input: [{
        role: 'user',
        content: typeof config.content === 'string'
          ? config.content
          : (config.content && config.content.type === 'image' && config.content.imageUrl
              ? [
                  { type: 'input_image', image_url: config.content.imageUrl },
                  { type: 'input_text',
                    text: 'Analyze this image and extract structured information. Image metadata: '
                          + JSON.stringify((config.content && config.content.metadata) || {}) }
                ]
              : JSON.stringify(config.content))
      }],
      reasoning: { effort: config.reasoning || 'none' },
      max_output_tokens: 16000,
      text: {
        format: {
          type: 'json_schema',
          name: config.schemaName,
          strict: true,
          schema: config.schema
        },
        verbosity: 'low'
      }
    }

  timeoutMs: 120000

  retry:
    attempts: 3
    backoff: exponential
    # 520/522/524 are CLOUDFLARE EDGE errors, not OpenAI ones: the origin returned something the
    # edge could not read, never answered, or exceeded the edge timeout. They are transient in exactly
    # the way 502/503/504 are, and a live run hit a 520 after 154s with no retry because they were
    # missing here. Added alongside the origin 5xx rather than instead of them.
    on: [429, 500, 502, 503, 504, 520, 522, 524]

  # How the reply is framed. A call is one thing: how it is made and how it comes back.
  transport: json

  # A 200 carrying an error body must not read as success.
  error:
    when: "return !!response.error"
    message: "return response.error.message"
