configSchema:
  type: object
  required: [model, content, schema]

  properties:
    content:
      type: string
      title: Content
      description: >-
        The text to extract from, usually an upstream node's output. A picture is given as
        an object with type image and its imageUrl instead.
      default: ""
      ui:field: template

    schema:
      type: object
      title: Schema
      description: >-
        The JSON schema the answer must match, as a return expression. Strict: every
        property listed as required, additionalProperties false at every level.
      default: {}
      ui:field: template

    model:
      type: string
      title: Model
      description: GPT-5.6 model to use for structured extraction
      enum: { $ref: models#enum }
      enumNames: { $ref: models#enumNames }
      default: { $ref: models#default }
      # A retired id resolves to the current best model in its tier, so replacing a
      # model generation cannot break a saved workflow.
      resolve: modelTier

    instructions:
      type: string
      title: Instructions
      description: >-
        How to read the content when it is ambiguous, such as which of two addresses to
        take. The schema already fixes the shape, so this is only about judgement.
      default: Extract structured information from the provided content.
      ui:field: template

    schemaName:
      type: string
      title: Schema Name
      description: Name for the JSON schema, surfaced to the model
      default: extraction

    reasoning:
      type: string
      title: Reasoning
      description: >-
        How much the model thinks before it answers. Off for extraction: the schema fixes
        the shape and the content fixes the facts (owner ruling 2026-09-09).
      enum: [none, low, medium, high]
      default: none
ui:order: [model, content, schema, instructions, schemaName, reasoning]
