$schema: ../../../_schema/config.schema.json

configSchema:
  type: object
  required: [model]

  properties:
    # Model and dimensions travel as ONE value, "<model>:<dims>", because they are not
    # independent: text-embedding-3-small cannot do 3072. One picker cannot express an
    # invalid pair, two could.
    model:
      type: string
      title: Embedding Model
      description: Select model and dimensions
      enum:
        - text-embedding-3-small:512
        - text-embedding-3-small:1536
        - text-embedding-3-large:1024
        - text-embedding-3-large:1536
        - text-embedding-3-large:3072
        - text-embedding-ada-002:1536
      enumNames:
        - text-embedding-3-small (512D) - Fast
        - text-embedding-3-small (1536D) - Higher quality
        - text-embedding-3-large (1024D) - Balanced
        - text-embedding-3-large (1536D) - Best quality
        - text-embedding-3-large (3072D) - Maximum
        - text-embedding-ada-002 (1536D) - Legacy
      default: text-embedding-3-large:1536

    normalize:
      type: boolean
      title: Normalize Embeddings
      description: Normalize to unit length (recommended for cosine similarity)
      default: true
      ui:widget: toggle

    # WHO MAY RUN THIS BOX, set by whoever builds the workflow (15-who-can-run-it.md).
    #
    # INSTANCE config, not the manifest's `auth`, and the two answer different questions.
    # The manifest is the node author's FLOOR: "this node is inherently privileged". These
    # are the builder's, per box on the canvas, because the same node type legitimately
    # faces staff on one workflow and customers on another.
    #
    # A role especially has to live here: `finance:approve` is a claim THIS deployment's
    # identity provider mints, and a node published to the marketplace cannot know the role
    # vocabulary of every universe that installs it.
    #
    # The executor takes the STRICTER of the two. Neither can loosen the other.
    authRequired:
      type: boolean
      title: Require sign-in
      description: Only signed-in callers can run this step.
      default: false
      "ui:widget": toggle
    authRole:
      type: string
      title: Require role
      description: A claim the caller must carry, like finance:approve.
      default: ""
      "ui:dependencies": { authRequired: true }

ui:order: [model, normalize, authRequired, authRole]
