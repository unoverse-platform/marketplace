$schema: ../../../_schema/config.schema.json

# The settings panel. Transcribed from src/OpenAIStream/node/index.ts configSchema.
# This is the file with the most churn: new model options land here and nowhere else.

configSchema:
  type: object
  required: [model, prompt]

  properties:
    model:
      type: string
      title: Model
      description: Select the GPT-5.6 model variant
      enum: { $ref: models#enum }
      enumNames: { $ref: models#enumNames }
      default: { $ref: models#default }
      # Executor resolver: a retired id falls back to the current best model in its
      # tier, so replacing a model generation cannot break a saved workflow.
      resolve: modelTier

    reasoningEffort:
      type: string
      title: Reasoning Effort
      description: >-
        Control reasoning depth. GPT-5.6 family: none/low/medium/high/xhigh/max.
        Older mini/nano models: none becomes minimal, xhigh/max become high automatically.
      enum: [none, low, medium, high, xhigh, max]
      default: none

    reasoningSummary:
      type: string
      title: Reasoning Summary
      description: Control reasoning summary visibility.
      enum: [auto, concise, detailed]
      default: concise

    verbosity:
      type: string
      title: Verbosity
      description: Control output length
      enum: [low, medium, high]
      default: medium

    systemPrompt:
      type: string
      title: System Prompt
      description: >-
        Standing instructions for every run: the model's role, tone and limits. Optional.
        Shared blocks work here, e.g. {{prompt.markdownGuidelines}}.
      default: ""
      ui:field: template

    # DROPPED IN MIGRATION: enablePreambles and enableMarkdown. Both were booleans
    # that injected a fixed block of text into the prompt. Preambles are native GPT-5
    # behaviour with no API parameter, and formatting advice belongs in the prompt
    # block library where it stays editable: put {{prompt.markdownGuidelines}} in the
    # System Prompt below. See api.yaml.
    #
    # Every remaining field maps to a real Responses API request parameter.

    prompt:
      type: string
      title: Prompt
      description: The request to answer. Usually wired in from an upstream node.
      default: ""
      ui:field: template

    maxTokens:
      type: number
      title: Max Output Tokens
      description: Maximum number of tokens to generate
      default: 2048
      minimum: 1
      maximum: 128000

    # WHO MAY RUN THIS BOX, set by whoever builds the workflow (15-who-can-run-it.md).
    #
    # INSTANCE config, not the manifest's `auth`, and the two answer different questions.
    # The manifest is the node author's FLOOR: "this node is inherently privileged". These
    # are the builder's, per box on the canvas, because the same node type legitimately
    # faces staff on one workflow and customers on another.
    #
    # A role especially has to live here: `finance:approve` is a claim THIS deployment's
    # identity provider mints, and a node published to the marketplace cannot know the role
    # vocabulary of every universe that installs it.
    #
    # The executor takes the STRICTER of the two. Neither can loosen the other.
    authRequired:
      type: boolean
      title: Require sign-in
      description: >-
        Only a signed-in caller may run this step. Leave off and it runs for whoever the
        workflow's trigger admitted, which is the usual answer.
      default: false
      "ui:widget": toggle
    authRole:
      type: string
      title: Require role
      description: >-
        A claim the caller's account must carry, as noun:verb (finance:approve,
        payments:refund). Leave blank to require only that they are signed in.
      default: ""
      "ui:dependencies": { authRequired: true }

ui:order:
  - model
  - reasoningEffort
  - reasoningSummary
  - verbosity
  - systemPrompt
  - prompt
  - maxTokens
  - authRequired
  - authRole
