$schema: ../../../_schema/node.schema.json

# Transcribed from src/OpenAIStream/node/index.ts. See docs/architecture/DECLARATIVE_NODES.md.

type: OpenAIStream

# It streams (api.yaml transport: sse), so lint requires CallbackNode here.
kind: CallbackNode

name: OpenAI Stream
category: AI
color: "#2F6F66"

description: Text generation with tokens streamed live as they are produced

# This used to say "the default for one-shot work", which is the OpenAI node's job and
# said so in nearly the same words, while the two descriptions were near-identical too.
# Two nodes competing for one task query is exactly how doc 14 says a node gets buried:
# they rank against each other and the loser never surfaces. This one owns LIVE OUTPUT,
# the only thing it has that OpenAI does not.
whenToUse: >-
  Summarize, extract, answer or generate text with the reply arriving word by word as it is
  written, so a person watches it appear rather than waiting for a finished block. A single
  pass, plus a few bounded tool calls when MCP provider nodes are attached by service edge;
  it is not an iterative loop, so many sequential tool calls or multi-turn work needs more.

capabilities:
  # NEVER cacheable: an LLM completion is non-deterministic, so re-running is the
  # correct behaviour and reusing a prior answer would be wrong, not thrifty.
  cacheable: false
