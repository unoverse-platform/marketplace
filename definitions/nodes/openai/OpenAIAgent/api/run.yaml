# The main call: OpenAI's Responses API. NO SDK.
#
# The Agents SDK is client-side orchestration over this same endpoint, so what it gives
# you is a loop, not a capability. Doing the loop from here keeps an agent portable: the
# platform counts turns and spots a stuck one, and everything about OpenAI's wire format
# lives in this folder.
#
# A CALL is one thing: how it is made AND how its reply is framed. That is why transport,
# terminator and error live here and not in a file of their own.

# ── CONVERSATION MEMORY ──────────────────────────────────────────────────────────────
#
# ONE step here, and it is the READ. The write is the tool loop's, declared as
# `continuity.remember` in toolExchange.yaml, because the id this feature stores does not
# exist until the model has finished speaking. See that file for why the two halves live
# apart.
#
# What is NOT here is the point. No history is read, assembled, injected or stored. The
# only thing that crosses this boundary is an opaque id; OpenAI holds the turns against
# it and prepends them itself. So this stays a memory feature with no memory in it.
#
# KEYED BY THE CHAT THREAD, not the user, because a signed-out guest HAS a thread and has
# no user id. Keying on an absent user id would resolve every guest to one key and feed
# them each other's history, which is a leak, not a degraded feature. The trade is that
# memory lives as long as the thread: a new thread starts fresh.

- name: cached
  # Switched off, or no thread id: either way nothing is read and the run starts a fresh
  # chain. Skipped leaves NO `calls.cached` at all, which is what `generate` tests.
  when: "return !!config.enableConversationMemory && !!scope.conversationId"
  state: read
  key: "openai:conversation:{{ scope.conversationId }}"

- name: generate
  method: POST
  url: { $ref: endpoints#responses }

  credential:
    scheme: bearer
    token: "{{ credentials.openAICredential.apiKey }}"

  body:
    model: "{{ config.model }}"
    input: "{{ config.prompt }}"
    # THE SEED, and only on turn one. Cold (memory off, no thread, or a chain older than
    # OpenAI's 30 days) renders empty and is dropped, which starts a new chain rather than
    # failing — the same outcome as a page reload, and the reason no fallback is written
    # here. From turn two the loop supplies this key itself from the id the last turn
    # settled on, and the loop's value wins.
    previous_response_id: "{{ calls.cached.id }}"
    # THE ROLE, THEN WHATEVER APPLIES WHERE THE CONVERSATION IS STANDING.
    #
    # `skillsText` is the loop's, rendered from the skills attached to the region this
    # conversation's last search anchored in. Empty until one applies, so an agent that never
    # reaches an attached region sends exactly what it always did.
    #
    # ROLE FIRST is not cosmetic: `instructions` is the cached prefix, so the stable text has
    # to come before the part that changes or a skill loading would throw away the whole
    # cached prefix instead of just its tail.
    instructions: "{{ config.systemPrompt }}{{ skillsText }}"
    max_output_tokens: "{{ config.maxTokens }}"
    stream: true
    reasoning:
      effort: "{{ config.reasoningEffort }}"
      summary: "{{ config.reasoningSummary }}"
    text:
      verbosity: "{{ config.verbosity }}"

  timeoutMs: 600000

  retry:
    attempts: 3
    backoff: exponential
    # 520/522/524 are CLOUDFLARE EDGE errors, not OpenAI ones: the origin returned something the
    # edge could not read, never answered, or exceeded the edge timeout. They are transient in exactly
    # the way 502/503/504 are, and a live run hit a 520 after 154s with no retry because they were
    # missing here. Added alongside the origin 5xx rather than instead of them.
    on: [429, 500, 502, 503, 504, 520, 522, 524]

  # How the reply is framed.
  transport: sse
  terminator: "[DONE]"

  # A 200 carrying an error body must not read as success.
  error:
    when: "return response.type === 'response.failed'"
    message: "return response.response.error.message"
