configSchema:
  type: object
  # `prompt` IS REQUIRED, and leaving it out was a live bug rather than a preference.
  #
  # The Responses API requires `input`, and this node's body builds `input` from `prompt` alone. An
  # empty prompt does not send an empty input — `resolveBody` OMITS a key that resolved to "", on the
  # grounds that vendors reject "" where they accept absence — so the field disappears entirely and
  # OpenAI answers `400 Missing required parameter: 'input'`, surfacing as a node-service 500.
  #
  # The retired executor could not fail this way: it always pushed a `{ role: "user" }` message, so
  # an empty prompt sent an empty turn and got a pointless but successful reply. Requiring the field
  # is the honest fix — the node has nothing to do without it — and it moves the complaint from a
  # vendor 400 to config validation, where the canvas can show it.
  #
  # `OpenAIStream` and `BedrockClaude` already required it. This node and `OpenAIAgent` were the
  # inconsistent pair.
  required: [model, prompt]

  properties:
    model:
      type: string
      title: Model
      description: Select the OpenAI model to use
      enum: { $ref: models#enum }
      enumNames: { $ref: models#enumNames }
      default: { $ref: models#default }
      # A retired id falls back to the current best model in its tier, so replacing a
      # model generation cannot break a saved workflow.
      resolve: modelTier

    maxTokens:
      type: number
      title: Max Tokens
      # 256 was the old default and it was wrong: a summary or a rewrite of anything
      # real runs past it, and the model stops MID-SENTENCE with no error anywhere.
      # A truncated answer that looks like a finished one is the worst failure this
      # node has, so the default has to clear ordinary prose.
      description: >-
        Hard ceiling on the reply. The model stops when it hits this, mid-sentence and
        without an error, so raise it for long output rather than leaving it to trim.
      default: 1200
      minimum: 1
      maximum: 128000

    systemPrompt:
      type: string
      title: System Prompt
      # UI copy. Short, plain, and about the SETTING. The template grammar and its traps
      # are not repeated here: the building model reads them from the template-references
      # skill, which covers every template field on every node.
      description: >-
        Standing instructions for every run: the model's role, tone and limits. Optional.
        Shared blocks work here, e.g. {{prompt.markdownGuidelines}}.
      default: ""
      ui:field: template

    prompt:
      type: string
      title: Prompt
      description: The request to answer. Usually wired in from an upstream node.
      default: ""
      ui:field: template
ui:order: [model, maxTokens, systemPrompt, prompt]
