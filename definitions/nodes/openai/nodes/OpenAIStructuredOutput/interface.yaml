# ONE INPUT (docs/nodes/signal-routing.md, "Two inputs never arrive together"). The content
# and the schema are config fields resolved from the same upstream data, so the one call
# always has both. Declared as two inputs, this node fired twice on a canvas, once per
# input, each time missing the other (2026-09-19).
inputs:
  - name: signal
    type: object
    description: Upstream data; the content and schema fields read from it

outputs:
  - name: result
    type: object
    description: Extracted structured data matching the schema

  - name: usage
    type: object
    description: Token usage information

credentials:
  - name: openAICredential
    required: true
    displayName: OpenAI API
