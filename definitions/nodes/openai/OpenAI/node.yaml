$schema: ../../../_schema/node.schema.json

# Transcribed from src/OpenAI/node/index.ts.

type: OpenAI

# Settles once: one request, one result. FIRST real node on the PromiseNode path.
kind: PromiseNode

name: OpenAI
category: AI
color: "#2F6F66"

description: One prompt in, one completion out, with no streaming or tools

whenToUse: >-
  Single prompt to single completion, the plain one-shot text generator: summarise,
  rewrite, classify, answer. No streaming, no tools, no schema enforcement; reach for a
  heavier node only when a step genuinely needs token streaming, iterative tool use, or
  strict JSON output.

capabilities:
  # NEVER cacheable: a completion is non-deterministic, so re-running is correct and
  # reusing a prior answer would be wrong.
  cacheable: false
