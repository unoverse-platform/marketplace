$schema: ../../../_schema/config.schema.json

configSchema:
  type: object
  required: [model]

  properties:
    model:
      type: string
      title: Model
      description: Select the OpenAI model to use
      enum: { $ref: ../../shared/models.yaml#/enum }
      enumNames: { $ref: ../../shared/models.yaml#/enumNames }
      default: gpt-5.6-terra
      # A retired id falls back to the current best model in its tier, so replacing a
      # model generation cannot break a saved workflow.
      resolve: modelTier

    temperature:
      type: number
      title: Temperature
      description: Controls randomness (0-2)
      default: 0.7
      minimum: 0
      maximum: 2

    maxTokens:
      type: number
      title: Max Tokens
      description: Maximum number of tokens to generate
      default: 256
      minimum: 1
      maximum: 128000

    systemPrompt:
      type: string
      title: System Prompt
      description: >-
        Who the model is and how it should respond. Compose prompt blocks and upstream
        values, e.g. {{prompt.markdownGuidelines}}.
      default: ""
      ui:field: template

    prompt:
      type: string
      title: Prompt
      description: The message the model responds to, usually wired in from upstream.
      default: ""
      ui:field: template

    history:
      type: array
      title: History
      description: >-
        Prior messages for context, as [{ role, content }]. An array field, so its value
        is a `return ...` expression rather than handlebars.
      ui:field: template

ui:order: [model, temperature, maxTokens, systemPrompt, prompt, history]
