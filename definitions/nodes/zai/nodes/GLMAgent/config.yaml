configSchema:
  type: object
  required: [model, prompt]
  properties:
    model:
      type: string
      title: Model
      description: >-
        Z.AI GLM model. GLM-5.3 is the newest flagship (the GLM-5.2 base with better post-training,
        1M context, 128K output); it always thinks, so Off does not apply to it. GLM-5.2 is the
        previous flagship. GLM-5-Turbo is faster and cheaper with 200K context, but reasoning_effort
        is GLM-5.2+ only, so every effort behaves the same on Turbo.
      enum: [glm-5.3, glm-5.2, glm-5-turbo]
      enumNames: ["GLM-5.3 (newest, deepest reasoning)", "GLM-5.2 (previous flagship)", "GLM-5-Turbo (faster/cheaper)"]
      default: glm-5.3
    agentName:
      type: string
      title: Agent Name
      description: Name for this agent (for logs and traces)
      default: GravityAgent
    maxTurns:
      type: number
      title: Max Turns
      description: Maximum agent loop iterations (tool calls plus responses)
      default: 15
      minimum: 1
      maximum: 50
    reasoningEffort:
      type: string
      title: Reasoning Effort
      description: >-
        Depth of the model's chain-of-thought. Low is the lightest (GLM-5.3 only: GLM-5.2 treats it as
        High), High is enhanced reasoning (the default, strong tool-calling at far fewer reasoning
        tokens), Max is the deepest. Off disables thinking and works on GLM-5.2 and Turbo only:
        GLM-5.3 always thinks.
      enum: [low, high, max, none]
      enumNames:
        - Low (lightest reasoning, GLM-5.3)
        - High (enhanced reasoning, default)
        - Max (deepest reasoning, most tokens)
        - Off (no thinking, GLM-5.2 and Turbo only)
      default: high
    maxTokens:
      type: number
      title: Max Output Tokens
      description: >-
        Maximum output tokens. CRITICAL with thinking enabled: reasoning counts against this budget and
        the model only emits a tool call AFTER thinking closes, so set it too low and a long reasoning
        pass is truncated before any tool call — the agent then silently never calls a tool. GLM's model
        card recommends 65536 for agentic use.
      default: 65536
      minimum: 1
      maximum: 131072
    temperature:
      type: number
      title: Temperature
      description: Sampling temperature (GLM-5.2 default 1.0)
      default: 1.0
      minimum: 0
      maximum: 1
    topP:
      type: number
      title: Top P
      description: Nucleus sampling (GLM-5.2 default 0.95)
      default: 0.95
      minimum: 0.01
      maximum: 1
    systemPrompt:
      type: string
      title: Instructions
      description: Agent instructions. Shared blocks work here, e.g. {{prompt.markdownGuidelines}}.
      default: ""
      "ui:field": template
    prompt:
      type: string
      title: Input
      description: The request to answer. Usually wired in from an upstream node.
      default: ""
      "ui:field": template
"ui:order":
  [model, agentName, maxTurns, reasoningEffort, maxTokens, temperature, topP, systemPrompt, prompt]
