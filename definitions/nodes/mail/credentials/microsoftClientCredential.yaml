# THE PLATFORM'S ONE MICROSOFT APPLICATION, saved once and never again.
#
# NOBODY CHOOSES THIS, which is why `visibility: internal` keeps it out of the credentials
# picker. It is collected in the panel that opens under the Connect button, the first time
# anyone on this platform connects an Outlook mailbox, and never seen again.
#
# It is a credential rather than a setting so it is encrypted at rest with everything else, and
# so it can be saved from the screen a person is already standing on instead of by editing a
# file and restarting.

name: microsoftClientCredential
displayName: Microsoft application
category: Platform setup
visibility: internal
description: The OAuth client that makes Microsoft's approval screen say unoverse. Collected once, under the Connect button.
documentationUrl: https://portal.azure.com/#view/Microsoft_AAD_RegisteredApps/ApplicationsListBlade

properties:
  - name: clientId
    displayName: Application (client) ID
    type: string
    required: true
    secret: false
    description: The Application (client) ID from the app registration.
    placeholder: 00000000-0000-0000-0000-000000000000

  - name: clientSecret
    displayName: Client secret
    type: string
    required: true
    secret: true
    description: The VALUE of a client secret, from Certificates and secrets.
    placeholder: ""
