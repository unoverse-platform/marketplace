# One row, one connector. No `calls.after` means the input named no campaign.

- emit: output
  from: response
  value: >-
    return calls.after
      ? { ok: calls.after.status === 'ACTIVE', campaign_id: String(signal.input.campaign_id),
          status: calls.after.status, daily_budget: (calls.after.dailyBudget || {}).amount }
      : { ok: false, error: 'account_id and campaign_id are required' }
