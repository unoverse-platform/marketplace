name: slackBotToken
displayName: Slack
description: Slack Bot User OAuth Token for API access
documentationUrl: https://api.slack.com/authentication/token-types#bot

properties:
  - name: token
    displayName: Bot Token
    type: string
    required: true
    secret: true
    description: Bot User OAuth Token
    placeholder: xoxb-

  - name: signingSecret
    displayName: Signing Secret
    type: string
    required: false
    secret: true
    description: >-
      From the Slack app's Basic Information page. Proves a message came from Slack, so an Agent
      can be mentioned. Without it, no message from Slack is accepted.

  - name: host
    displayName: Host
    type: string
    required: false
    secret: false
    description: Slack API host. Defaults to slack.com.
    placeholder: slack.com
