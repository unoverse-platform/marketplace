$schema: ../../../_schema/config.schema.json

# NO CREDENTIAL, and that is the point of this node's rewrite. The code version held an
# `openAICredential` because it called OpenAI directly for embeddings. The engine owns that now, along
# with the extraction schema and the prompts, so the node carries no key at all.

configSchema:
  type: object
  required: [rawContent, category]
  properties:
    rawContent:
      type: string
      title: Raw Content
      description: The text to read. Usually wired in from an upstream node.
      default: ""
      "ui:field": template
    category:
      type: string
      title: Category
      # The engine defines six, and only these two are what this node produces. IMAGE and DOCUMENT come
      # from the Cloudinary and document connectors; MCP and SKILL from spatial discovery. Offering all
      # six would be four options that quietly produce nothing useful.
      description: What the text describes — a need someone has, or a product or service on offer.
      enum: [NEED, SERVICE]
      enumNames: [Need, Product or service]
      default: NEED
    sourceUrl:
      type: string
      title: Source URL
      description: Where the text came from, kept for provenance. Optional.
      default: ""
      "ui:field": template
    maxItems:
      type: number
      title: Max Items
      description: Cap on how many entries to store from this text. Leave blank for no cap.
      minimum: 1
      maximum: 500

    # WHO MAY RUN THIS BOX, set by whoever builds the workflow (15-who-can-run-it.md).
    #
    # INSTANCE config, not the manifest's `auth`, and the two answer different questions.
    # The manifest is the node author's FLOOR: "this node is inherently privileged". These
    # are the builder's, per box on the canvas, because the same node type legitimately
    # faces staff on one workflow and customers on another.
    #
    # A role especially has to live here: `finance:approve` is a claim THIS deployment's
    # identity provider mints, and a node published to the marketplace cannot know the role
    # vocabulary of every universe that installs it.
    #
    # The executor takes the STRICTER of the two. Neither can loosen the other.
    authRequired:
      type: boolean
      title: Require sign-in
      description: >-
        Only a signed-in caller may run this step. Leave off and it runs for whoever the
        workflow's trigger admitted, which is the usual answer.
      default: false
      "ui:widget": toggle
    authRole:
      type: string
      title: Require role
      description: >-
        A claim the caller's account must carry, as noun:verb (finance:approve,
        payments:refund). Leave blank to require only that they are signed in.
      default: ""
      "ui:dependencies": { authRequired: true }

"ui:order": [rawContent, category, sourceUrl, maxItems, authRequired, authRole]
