$schema: ../../../_schema/config.schema.json

# NO CREDENTIAL, and that is the point of this node's rewrite. The code version held an
# `openAICredential` because it called OpenAI directly for embeddings. The engine owns that now, along
# with the extraction schema and the prompts, so the node carries no key at all.

configSchema:
  type: object
  required: [rawContent]
  properties:
    rawContent:
      type: string
      title: Raw Content
      description: The text to read. Usually wired in from an upstream node.
      default: ""
      "ui:field": template
    # NO CATEGORY FIELD (removed 2026-08-07, platform owner's ruling). This node ingests
    # NEEDS, full stop. Products and services are created by PROMOTING a page from the
    # Content tree (POST /content/promote-page): that lane fetches the page fresh and
    # whole, grounds the entry structurally in one page, refuses to promote the same URL
    # twice, and stamps metadata.promoted for the tree. A raw-text SERVICE lane here was
    # the same row kind minted with none of those guarantees — a duplicate door, strictly
    # worse. IMAGE and DOCUMENT come from the Cloudinary and document connectors; MCP and
    # SKILL from spatial discovery.
    sourceUrl:
      type: string
      title: Source URL
      description: Where the text came from, kept for provenance. Optional.
      default: ""
      "ui:field": template
    metadata:
      type: string
      title: Metadata (JSON)
      # FREE-FORM BY DESIGN (platform owner's ruling, 2026-08-07): the caller decides the
      # vocabulary — documentTitle, client, quarter, whatever future search will filter by.
      # Stored verbatim on every need extracted from this text (the extractor merges the
      # source's metadata onto each entry). A template STRING holding JSON, not an object
      # field, because the config form has no JSON field type yet (backlog 2026-08-01);
      # run.yaml parses it and fails the run loudly on invalid JSON.
      description: 'Optional JSON object stamped onto every need from this text, e.g. {"documentTitle": "Q3 Deck", "client": "Acme"}. You choose the keys; future search can filter by them.'
      default: ""
      "ui:field": template
    maxItems:
      type: number
      title: Max Items
      description: Cap on how many entries to store from this text. Leave blank for no cap.
      minimum: 1
      maximum: 500

    # WHO MAY RUN THIS BOX, set by whoever builds the workflow (15-who-can-run-it.md).
    #
    # INSTANCE config, not the manifest's `auth`, and the two answer different questions.
    # The manifest is the node author's FLOOR: "this node is inherently privileged". These
    # are the builder's, per box on the canvas, because the same node type legitimately
    # faces staff on one workflow and customers on another.
    #
    # A role especially has to live here: `finance:approve` is a claim THIS deployment's
    # identity provider mints, and a node published to the marketplace cannot know the role
    # vocabulary of every universe that installs it.
    #
    # The executor takes the STRICTER of the two. Neither can loosen the other.
    authRequired:
      type: boolean
      title: Require sign-in
      description: Only signed-in callers can run this step.
      default: false
      "ui:widget": toggle
    authRole:
      type: string
      title: Require role
      description: A claim the caller must carry, like finance:approve.
      default: ""
      "ui:dependencies": { authRequired: true }

"ui:order": [authRequired, authRole, rawContent, sourceUrl, metadata, maxItems]
