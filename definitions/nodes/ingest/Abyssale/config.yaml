$schema: ../../../_schema/config.schema.json

configSchema:
  type: object
  required: [templateId]
  properties:
    templateId:
      type: string
      title: Template ID
      description: Abyssale template UUID (from your Abyssale dashboard)
    multiPage:
      type: boolean
      title: Multi-Page PDF
      description: Generate a multi-page PDF document
      default: false
      "ui:widget": toggle
    pageCount:
      type: number
      title: Page Count
      description: Number of pages in the template
      minimum: 1
      maximum: 50
      default: 2
      "ui:dependencies":
        multiPage: true
    compressionLevel:
      type: number
      title: Compression Level
      description: JPEG compression percentage (1-100)
      default: 80
      minimum: 1
      maximum: 100
    formatName:
      type: string
      title: Format Name
      description: Optional template format to render, when the template defines more than one.
      default: ""
    elements:
      type: object
      title: Elements
      description: >-
        Map template layer names to values. A plain string becomes text; a URL becomes an image.
        JS: return { 'layer-name': { payload: signal.data.text } }
      default: ""
      "ui:field": template

    # WHO MAY RUN THIS BOX, set by whoever builds the workflow (15-who-can-run-it.md).
    #
    # INSTANCE config, not the manifest's `auth`, and the two answer different questions.
    # The manifest is the node author's FLOOR: "this node is inherently privileged". These
    # are the builder's, per box on the canvas, because the same node type legitimately
    # faces staff on one workflow and customers on another.
    #
    # A role especially has to live here: `finance:approve` is a claim THIS deployment's
    # identity provider mints, and a node published to the marketplace cannot know the role
    # vocabulary of every universe that installs it.
    #
    # The executor takes the STRICTER of the two. Neither can loosen the other.
    authRequired:
      type: boolean
      title: Require sign-in
      description: >-
        Only a signed-in caller may run this step. Leave off and it runs for whoever the
        workflow's trigger admitted, which is the usual answer.
      default: false
      "ui:widget": toggle
    authRole:
      type: string
      title: Require role
      description: >-
        A claim the caller's account must carry, as noun:verb (finance:approve,
        payments:refund). Leave blank to require only that they are signed in.
      default: ""
      "ui:dependencies": { authRequired: true }

"ui:order": [templateId, elements, formatName, multiPage, pageCount, compressionLevel, authRequired, authRole]
