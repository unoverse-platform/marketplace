type: PlaidTransactions
kind: PromiseNode

name: Plaid Transactions
category: Storage & Data
color: "#00D09C"
logoUrl: https://res.cloudinary.com/sonik/image/upload/v1765729171/gravity/icons/plaid_logo.png

description: Fetch bank transactions from Plaid Sandbox for testing.

whenToUse: >-
  Pick ONLY when a workflow needs realistic test bank transactions. It hits Plaid Sandbox with test
  personas and never a live account, so it is a sandbox data source rather than a general store of
  real records.

# WHO MAY RUN THIS (DECLARATIVE_NODES.md §9.13). Compulsory on every node, so that a node
# nobody thought about cannot look the same as one deliberately left open.
#
# `required: false` adds no requirement of its own: the node runs for whoever the trigger
# admitted. The trigger instance's publicEntry toggle still owns the door, and requirements
# only ever narrow.
auth:
  required: false

capabilities:
  # CACHEABLE, on the platform's node memoization rather than a node-private cache. The node
  # before this one carried its own Redis cache (useCache, cacheTTLMinutes); that was dropped in the
  # migration and this flag replaces it. The fingerprint is the resolved config plus the caller and
  # the conversation, and nothing in this node's config references the message, so within one
  # conversation every question reads the SAME sandbox account for the memoization TTL.
  #
  # That is the point, not a thrift. Each run of the three calls in api/run.yaml mints a NEW sandbox
  # item with different invented transactions, so an uncached node gives "what did I spend" one
  # answer and "show me those" a different account. A person querying their account expects one
  # account for the length of the conversation.
  cacheable: true
