$schema: ../../../_schema/config.schema.json

configSchema:
  type: object
  required: [videoUrl, prompt]
  properties:
    videoUrl:
      type: string
      title: Video URL
      description: >-
        The clip to continue — the extension picks up from its final frame. Wire in the
        videoUrl an earlier video step produced, or paste any public MP4 URL. The vendor
        rejects clips longer than 15 seconds, so an already-extended clip usually needs
        trimming before it can be extended again.
      default: ""
      "ui:field": template
    prompt:
      type: string
      title: What Happens Next
      description: >-
        The next beat of the story — motion, camera and mood for the seconds being added,
        not a re-description of what already happened.
      default: ""
      "ui:field": template
      "ui:ai":
        editable: true
    duration:
      type: number
      title: Extension (seconds)
      description: How many seconds are added to the clip. Longer costs proportionally more.
      default: 6
      minimum: 2
      maximum: 10
"ui:order": [videoUrl, prompt, duration]
