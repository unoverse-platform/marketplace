$schema: ../../../_schema/config.schema.json

configSchema:
  type: object
  required: []
  properties:
    systemPrompt:
      type: string
      title: System Prompt
      description: System instructions for Grok. Shared blocks work here, e.g. {{prompt.markdownGuidelines}}.
      default: ""
      "ui:field": template
    initialRequest:
      type: string
      title: Initial Request
      description: Text sent as a user message at call start — Grok answers it immediately.
      default: ""
      "ui:field": template
    voice:
      type: string
      title: Voice
      description: The voice Grok speaks with
      enum: [eve, ara, rex, sal, leo]
      enumNames: [Eve, Ara, Rex, Sal, Leo]
      default: eve
    turnDetection:
      type: string
      title: Turn Detection
      description: >-
        How Grok decides the person has finished speaking. Manual disables detection entirely, so
        nothing is answered unless something else commits the audio buffer.
      enum: [server_vad, manual]
      enumNames: ["Server VAD (automatic)", Manual]
      default: server_vad
    conversationHistory:
      type: object
      title: Conversation History
      description: Array of prior turns ({ role, content }), replayed into the session before the call starts
      "ui:field": template

    # WHO MAY RUN THIS BOX, set by whoever builds the workflow (15-who-can-run-it.md).
    #
    # INSTANCE config, not the manifest's `auth`, and the two answer different questions.
    # The manifest is the node author's FLOOR: "this node is inherently privileged". These
    # are the builder's, per box on the canvas, because the same node type legitimately
    # faces staff on one workflow and customers on another.
    #
    # A role especially has to live here: `finance:approve` is a claim THIS deployment's
    # identity provider mints, and a node published to the marketplace cannot know the role
    # vocabulary of every universe that installs it.
    #
    # The executor takes the STRICTER of the two. Neither can loosen the other.
    authRequired:
      type: boolean
      title: Require sign-in
      description: Only signed-in callers can run this step.
      default: false
      "ui:widget": toggle
    authRole:
      type: string
      title: Require role
      description: A claim the caller must carry, like finance:approve.
      default: ""
      "ui:dependencies": { authRequired: true }

# `enableUserMemory`, `enableAgentMemory` and `redisChannel` are NOT here.
#
# The memory toggles belong to the MCP provider a workflow wires in, not to the consumer: which tools an
# agent gets is decided by the service edge, and duplicating that as node config gave two places to say
# one thing. `redisChannel` named the channel the code version published audio on, which the audio lane
# now owns — see api/audio.yaml.

"ui:order": [systemPrompt, initialRequest, voice, turnDetection, conversationHistory, authRequired, authRole]
