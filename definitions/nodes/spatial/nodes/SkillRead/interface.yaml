inputs:
  - name: signal
    type: object
    description: Upstream data; it starts the read, as a step in a lane, and the skill's name and file path may be templated from it
    required: false

outputs:
  - name: skill
    type: object
    description: "The skill in full ({ name, instructions, ... }), or the referenced file ({ path, content })"
  - name: text
    type: string
    description: The skill's instructions, or the file's content, as text a model reads

credentials: []
