inputs:
  - name: query
    type: string
    description: The search query. Usually templated into the Query setting from here.
    required: false

outputs:
  - name: results
    type: array
    description: The matching rows, lean-projected (a handle plus the editorial essentials)
  - name: count
    type: number
    description: How many rows matched
  - name: functions
    type: object
    description: What the rows can be asked, by function name
  - name: skills
    type: array
    description: The skills in force where the query landed
