# Nothing to set: what an agent may ask is the org's schema, read from its objects, and every
# query is checked against it. The org is the run's own.
configSchema:
  type: object
  required: []
  properties:
    query:
      type: object
      title: Query
      description: >-
        The query to ask when this node is a step in the data flow, in the query tool's own form
        ({"fund": {"where": ..., "fields": [...]}, "chunks": "words"}), usually built from upstream
        with return { ... }. Not read when the node is an Agent's tool
      default: {}
      ui:field: template
