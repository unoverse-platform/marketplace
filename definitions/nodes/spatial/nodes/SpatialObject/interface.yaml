# ONE INPUT, `signal`: the id, the function and its inputs are config fields templated from
# upstream (signal-routing.md, "Two inputs never arrive together"), so this node fires once with
# everything it needs.
inputs:
  - name: signal
    type: object
    description: Upstream data; the universal id, the function and its inputs are templated from it
    required: false

outputs:
  - name: row
    type: object
    description: >-
      The row in full, projected as the Agent's getDetail hands it over: the handle, the display
      fields, its metadata with the copy, and what came back from the object's own getDetail
      (a document's text, a table's rows, the row's parts)
  - name: text
    type: string
    description: The row's copy as text a model reads, bodyCopy when the row has it, else its description
  - name: image
    type: string
    description: >-
      The row's own picture as a URL, for a component to show; empty when it has none. This is
      the one place the picture leaves the row, and it goes to a screen, never into a prompt
  - name: result
    type: object
    description: >-
      What the named function answered, exactly as the row's object returns it; empty when no
      function was named

credentials: []
