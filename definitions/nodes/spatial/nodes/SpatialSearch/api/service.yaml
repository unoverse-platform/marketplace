# THE SIX TOOLS an attached agent gets. These are what the model reads when choosing a tool,
# so their wording IS the routing: rephrasing them is a behaviour change, never a tidy-up.
#
# Trimmed 2026-08-24 (v2.1). They were transcribed verbatim from the retired SPATIAL_SCHEMA
# and had accumulated restatements of the protocol in shared/schema.yaml. A rule now lives in
# exactly ONE place: the search rule and the skill rule in the protocol. Measured cause: a
# repeated question was being read as a reason not to search (33% search rate on repeats vs
# 100% on a first turn). See §Memory vs fresh search in docs/SPATIAL_SEARCH_GUIDE.md.

findIntent:
  description: >-
    Precision search. The user has NAMED what they want, a specific item, category or task
    ("X", "how do I...", "which one covers Y?", "recommend a good Z"), and this pinpoints the
    matches for that named need, however the ask is phrased. A question about the person's
    OWN records is a named need too: the map carries tasks that ACT on their data, not only
    things to read about, so search before ever answering that you cannot see or reach it.
    Pass the user's EXACT words from
    THIS turn: not paraphrased, and not carried over from an earlier turn. If they repeat
    themselves, those repeated words ARE this turn's question and this search still runs. NOT
    for open needs with no named thing ("where do I start?", "what are my options?"), which
    is discoverRelated. If ANY result has object_type="skill" you MUST call readSkill before
    responding; check ALL results, not just the top one. Do not pair with discoverRelated in
    parallel.
  calls:
    - $ref: search#call
      body:
        mode: "return 'intent'"
  # THE CARD LANE. A result row carrying a component renders it on the caller's live screen
  # the moment it surfaces: data-driven, never a model tool, so the model cannot forget to
  # show it or describe one that is not there. Declared BEFORE `returns` because a card needs
  # the full row that the lean projection strips. Unconditional on purpose: a row only
  # produces a card when it points at one.
  renderComponents: "return response.results"
  returns: { $ref: search#lean }

discoverRelated:
  description: >-
    Discovery search. For open needs where the user has NOT named the thing: a goal, a
    situation, a vague wish ("where should I start?", "what are my options?", "what's
    available?"). Surfaces the NEIGHBOURHOOD of possibilities around the need (content is
    grouped by need, so nearby items are the adjacent choices), including options the user
    did not think to ask about, which is the awareness surface. NOT for a named
    thing or category, which is findIntent. Also the follow-up when findIntent came back
    weak. Low similarity is normal here, so judge a result by WHAT IT IS and not by its
    score. A neighbour is still a real result: a task among them is callable, and one that
    answers what was actually asked IS the answer — call it, rather than describing it or
    saying you will.
  calls:
    - $ref: search#call
      body:
        mode: "return 'related'"
  # Same card lane as findIntent above.
  renderComponents: "return response.results"
  returns: { $ref: search#lean }

# THE DEPTH READ, THE SKILL READS AND EVERY OTHER TOOL are the objects' own (docs/unoverse/data/
# spatial/objects-in-spatial.md, "Found objects' functions as tools", 2026-09-16): a search reply
# names the public functions its rows' objects declare, and the Agent's harness mints a tool per
# name. This node keeps only its two searches.

# TOOL DISCOVERY. An attached agent calls this once per session and gets the instructions and
# the argument shapes for every tool above (ServiceConnector aggregates it across all wired
# MCP nodes). It is a META-method: deliberately absent from interface.yaml's `methods`, or it
# would be advertised to the model as a third tool.
#
# NO CALLS, and a LITERAL result. `calls: []` is not a placeholder: this method reaches
# nothing and hands back a constant, so `returns` names a YAML document rather than a
# `return { ... }` expression. Authored as data in shared/schema.yaml, where it can be read
# and diffed instead of escaped inside a string.
getSchema:
  description: Tool discovery for the spatial knowledge base, with the objects this node leaves to the agent
  # THE OBJECTS THE AGENT MAY TURN ON (docs/unoverse/data/spatial/objects-in-spatial.md): the
  # engine resolves this node's settings every run. The route never answers with an error, so a
  # failure there leaves the agent its tools with the On objects rather than no tools at all.
  calls:
    - name: objects
      method: POST
      url: "return scope.engineUrl + '/spatial/objects'"
      transport: json
      body:
        workflowId: "return scope.workflowId"
        org: "return scope.org"
        settings: "return (config.objects && typeof config.objects === 'object') ? config.objects : undefined"
  # The fixed schema, merged deeply: only the two searches' `objects` input and its `required`
  # are computed; every other word is the constant in shared/schema.yaml.
  returns:
    $ref: schema#spatial
    methods:
      findIntent:
        input:
          required: "return helpers.objectsRequired(calls.objects)"
          properties:
            objects: "return helpers.objectsInput(calls.objects)"
      discoverRelated:
        input:
          required: "return helpers.objectsRequired(calls.objects)"
          properties:
            objects: "return helpers.objectsInput(calls.objects)"
