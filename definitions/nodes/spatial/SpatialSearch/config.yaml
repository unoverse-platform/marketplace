# Transcribed from the retired node's configSchema. These shape what an AGENT'S searches are
# allowed to return, and they are read by shared/search.yaml on every call.
#
# THE AUTHOR OWNS THESE, NEVER THE MODEL. None is exposed as a tool argument: an agent
# chooses what to ask for, the author decides what may come back. A model that could set its
# own result cap or turn on a content type would route around the person who wired the node.
#
# WIRABLE, STILL NEVER THE MODEL'S (2026-08-13). What a box may return can be decided PER RUN
# by the workflow instead of once at design time. The case that forced it: a turn addressed at
# a component already on screen must not have a search hand back a component row, because that
# row renders a NEW card unconditionally (`renderComponents` in api/service.yaml). The route
# sets `includeMcps: false` for that turn and true otherwise.
#
# This does not weaken the line above, it keeps it. The value travels through CONFIG, whose
# only roots are the workflow's own surroundings (`signal.<nodeId>.<output>.<field>`), never
# through `params`, which on this node is the agent's tool arguments and nothing else. The
# workflow decides deterministically by route; the model still cannot see these or set them.
#
# A template field must be EXACTLY one `{{ path }}` to keep its type (config-schema.md): a
# `{{#if}}` produces the STRING "false", which is truthy. Carry a real boolean on the trigger
# and reference it whole. An unset flag still resolves to undefined so the SERVER's default
# applies, and those defaults are mostly TRUE — see the note in shared/search.yaml.
#
# THE MARKER IS NOT WHAT MAKES A FIELD WIRABLE, and carrying it on the numbers and the six
# toggles was a mistake, reverted 2026-08-15. The runtime resolves `{{ }}` in ANY string config
# value whatever the field is marked as (TemplateResolver.ts:54); `ui:field: template` only
# swaps the drawn control for the CodeMirror editor (FieldRenderer.jsx:82). That editor holds
# TEXT, so handing it the number 10 or the boolean true built a change set of length NaN and
# wedged the browser tab the moment the config panel opened — this node was the only one in
# the tree with a non-string template field. The control now follows the TYPE: steppers for
# the numbers, tick-boxes for the flags, the editor only for `sourceId`, which is a string.
# A route still wires any of them by writing `{{ signal.… }}` into the workflow's config.
#
# `renderComponents` is deliberately NOT here. It was a toggle until 2026-07-29 and was the wrong
# shape: a row only produces a card when it points at one, so "off" never meant cleaner
# results, it meant a row that had authored a card silently not showing it.

configSchema:
  type: object
  required: []
  properties:
    maxResults:
      type: number
      title: Max Results
      description: Maximum total results to return (safety cap)
      default: 10
      minimum: 5
      maximum: 30

    sourceId:
      type: string
      title: Source ID
      # OPT-IN, NEVER A DEFAULT (platform owner's ruling, 2026-08-08): blank searches the
      # whole map, exactly as before. Set, it restricts every search this box runs to rows
      # from ONE source — the standard source_id (migration 021) that SpatialIngest stamps
      # (e.g. an S3 document's universalId, wired in from an upstream node).
      description: Restrict searches to one source's entries (its source_id, e.g. from an upstream file node). Blank = whole map.
      default: ""
      "ui:field": template

    similarityThreshold:
      type: number
      title: Min Similarity (Intent)
      description: >-
        Precision floor for findIntent (0 to 0.9). Results scoring below this cosine
        similarity are dropped. Discovery is unaffected, since it ranks by spatial distance.
      default: 0.35
      minimum: 0
      maximum: 0.9
      step: 0.05

    # WHICH OBJECTS A SEARCH INCLUDES (docs/unoverse/data/spatial/objects-in-spatial.md). One
    # setting per object on the canvas's map, listed from the org's objects when the panel opens:
    # off (never searched, never offered to the agent), on (always searched; the agent cannot
    # turn it off), intelligent (the agent turns it on per search). An object with no setting
    # is Intelligent. Replaced the six include switches on 2026-09-14.
    objects:
      type: object
      title: Objects
      description: Which kinds of thing this search includes, and which the agent decides.
      default: {}
      "ui:widget": spatialObjects
"ui:order":
  [maxResults, similarityThreshold, sourceId, objects]
