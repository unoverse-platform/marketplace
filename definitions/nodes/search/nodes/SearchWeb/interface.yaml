inputs:
  - name: query
    type: string
    description: Search query
    required: false

outputs:
  - name: webResults
    type: array
    description: Web search results (title, url, source, snippet, thumbnail)
  - name: imageResults
    type: array
    description: Image results (url, title, thumbnail, source), Google's own image pack from the web search first, then the image search when it is on.

credentials:
  - name: searchapiCredential
    required: true
    displayName: SearchAPI
