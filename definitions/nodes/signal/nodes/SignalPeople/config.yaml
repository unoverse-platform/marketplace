configSchema:
  type: object
  required: []
  properties:
    # ONE PERSON, when the run knows who (owner 2026-10-24: "why get EVERYONE in Signal? we should
    # just get one person by id"). Set either and the node reads that one person, the same read
    # find_person makes; leave both empty and it lists, as before.
    id:
      type: string
      title: Person
      description: One person's Signal id, such as per_d50118c003414b209dc5. Leave empty to list.
      default: ""
      "ui:field": template
    email:
      type: string
      title: Email
      description: One person's email address, when the id is not known. Leave empty to list.
      default: ""
      "ui:field": template
    stage:
      type: string
      title: Stage
      description: Only people at this stage, prospect or customer. Leave empty for everyone.
      default: ""
    limit:
      type: number
      title: How many
      description: The most people to return, newest first. Leave empty for the service's own cap.
      default: 200
"ui:order": [id, email, stage, limit]
