inputs:
  - name: input
    type: object
    description: >-
      A person to save, in save_person's shape (at least one of linkedin, email or user_id, and
      whatever was found): they are saved, keep-and-update, and nothing is read. With no person on
      it, a trigger to list or find. The organisation is the run's own.
    required: false

outputs:
  - name: people
    type: array
    description: "Everyone Signal holds, newest first: person_id, name, role, company, stage, email, linkedin, crm_provider, observed, understood, inferred, researched, created_at, updated_at"
  - name: count
    type: number
    description: How many people came back
  - name: person
    type: object
    description: "The one person asked for by id or email, or the one just saved, as Signal holds them; null when none was named or found"
  - name: saved
    type: object
    description: "After a save: ok, created, person_id, or the reason it was not saved; null when nothing was given to save"

credentials: []

serviceConnectors:
  - name: mcpService
    serviceType: mcp
    isService: true
    methods: [save_person, find_person, list_people]
    description: >-
      MCP tools for an agent: save_person (find by LinkedIn, email or app account, then update or
      make), find_person (one person by id or key) and list_people (prospects and customers).
    instructions: >-
      save_person needs at least one of linkedin, email or user_id. Only what you pass is written;
      each layer passed replaces that layer whole. Never pass a value you were not given or did
      not find. Whether a person is a prospect or a customer is Signal's to decide.
