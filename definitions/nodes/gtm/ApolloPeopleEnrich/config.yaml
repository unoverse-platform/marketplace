$schema: ../../../_schema/config.schema.json

configSchema:
  type: object
  required: []
  properties:
    email:
      type: string
      title: Email
      description: Email address of the person. The strongest identifier.
      default: ""
      "ui:field": template
    linkedinUrl:
      type: string
      title: LinkedIn URL
      description: LinkedIn profile URL, e.g. 'https://linkedin.com/in/johndoe'
      default: ""
      "ui:field": template
    firstName:
      type: string
      title: First Name
      default: ""
      "ui:field": template
    lastName:
      type: string
      title: Last Name
      default: ""
      "ui:field": template
    domain:
      type: string
      title: Company Domain
      description: Domain of the person's company, e.g. 'google.com'
      default: ""
      "ui:field": template
    organizationName:
      type: string
      title: Company Name
      default: ""
      "ui:field": template
    revealPersonalEmails:
      type: boolean
      title: Reveal Personal Emails
      description: Request personal email addresses. CONSUMES CREDITS.
      default: false
      "ui:widget": toggle
    revealPhoneNumber:
      type: boolean
      title: Reveal Phone Number
      description: Request a phone number. CONSUMES CREDITS.
      default: false
      "ui:widget": toggle

    # WHO MAY RUN THIS BOX, set by whoever builds the workflow (15-who-can-run-it.md).
    #
    # INSTANCE config, not the manifest's `auth`, and the two answer different questions.
    # The manifest is the node author's FLOOR: "this node is inherently privileged". These
    # are the builder's, per box on the canvas, because the same node type legitimately
    # faces staff on one workflow and customers on another.
    #
    # A role especially has to live here: `finance:approve` is a claim THIS deployment's
    # identity provider mints, and a node published to the marketplace cannot know the role
    # vocabulary of every universe that installs it.
    #
    # The executor takes the STRICTER of the two. Neither can loosen the other.
    authRequired:
      type: boolean
      title: Require sign-in
      description: >-
        Only a signed-in caller may run this step. Leave off and it runs for whoever the
        workflow's trigger admitted, which is the usual answer.
      default: false
      "ui:widget": toggle
    authRole:
      type: string
      title: Require role
      description: >-
        A claim the caller's account must carry, as noun:verb (finance:approve,
        payments:refund). Leave blank to require only that they are signed in.
      default: ""
      "ui:dependencies": { authRequired: true }

"ui:order":
  [email, linkedinUrl, firstName, lastName, domain, organizationName,
   revealPersonalEmails, revealPhoneNumber, authRequired, authRole]
