$schema: ../../../_schema/config.schema.json

configSchema:
  type: object
  required: []
  properties:
    query:
      type: string
      title: Query
      description: >-
        A natural-language description of the companies you want. When set it REPLACES every
        filter below, which is Hunter's own rule rather than ours.
      default: ""
      "ui:field": template
    industry:
      type: string
      title: Industry
      description: Comma-separated industries
      default: ""
      "ui:field": template
    country:
      type: string
      title: Country
      description: Comma-separated two-letter country codes, e.g. 'GB, US'
      default: ""
      "ui:field": template
    headcount:
      type: string
      title: Headcount
      description: Comma-separated size bands, e.g. '1-10, 11-50'
      default: ""
      "ui:field": template
    technology:
      type: string
      title: Technology
      description: Comma-separated technologies the company uses
      default: ""
      "ui:field": template
    keywords:
      type: string
      title: Keywords
      description: Comma-separated keywords to match
      default: ""
      "ui:field": template
    companyType:
      type: string
      title: Company Type
      description: Comma-separated types, e.g. 'privately held, public company'
      default: ""
      "ui:field": template
    similarTo:
      type: string
      title: Similar To
      description: A domain to find lookalikes of
      default: ""
      "ui:field": template
    limit:
      type: number
      title: Limit
      default: 25
      minimum: 1
      maximum: 100
    offset:
      type: number
      title: Offset
      default: 0
      minimum: 0

    # WHO MAY RUN THIS BOX, set by whoever builds the workflow (15-who-can-run-it.md).
    #
    # INSTANCE config, not the manifest's `auth`, and the two answer different questions.
    # The manifest is the node author's FLOOR: "this node is inherently privileged". These
    # are the builder's, per box on the canvas, because the same node type legitimately
    # faces staff on one workflow and customers on another.
    #
    # A role especially has to live here: `finance:approve` is a claim THIS deployment's
    # identity provider mints, and a node published to the marketplace cannot know the role
    # vocabulary of every universe that installs it.
    #
    # The executor takes the STRICTER of the two. Neither can loosen the other.
    authRequired:
      type: boolean
      title: Require sign-in
      description: >-
        Only a signed-in caller may run this step. Leave off and it runs for whoever the
        workflow's trigger admitted, which is the usual answer.
      default: false
      "ui:widget": toggle
    authRole:
      type: string
      title: Require role
      description: >-
        A claim the caller's account must carry, as noun:verb (finance:approve,
        payments:refund). Leave blank to require only that they are signed in.
      default: ""
      "ui:dependencies": { authRequired: true }

"ui:order":
  [query, industry, country, headcount, technology, keywords, companyType, similarTo,
   limit, offset, authRequired, authRole]
