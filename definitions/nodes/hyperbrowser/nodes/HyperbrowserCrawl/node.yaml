type: HyperbrowserCrawl
kind: PromiseNode

name: Hyperbrowser Crawl
category: Web Scraping
color: "#FF6B6B"

description: Crawl a site from a seed URL across many pages, returning per-page markdown and links

whenToUse: >-
  Pick to FOLLOW LINKS from a seed URL across many pages of one site, bounded by a page
  limit and optional include or exclude patterns. It walks a site; reading one known page,
  pulling typed fields against a schema, and running a bulk offloaded actor are different
  jobs with their own nodes.

# WHO MAY RUN THIS (DECLARATIVE_NODES.md §9.13). Compulsory on every node, so that a node
# nobody thought about cannot look the same as one deliberately left open.
#
# `required: false` adds no requirement of its own: the node runs for whoever the trigger
# admitted. The trigger instance's publicEntry toggle still owns the door, and requirements
# only ever narrow.
auth:
  required: false

capabilities:
  # NOT cacheable, unlike Scrape. A crawl's answer is "what this site links to now", which
  # is the thing that changes, and one crawl can be hundreds of page fetches — a stale
  # reuse here is both wrong and expensive to have been right about.
  cacheable: false
