$schema: ../../../_schema/config.schema.json

configSchema:
  type: object
  required: [urls]
  properties:
    urls:
      # ARRAY OR STRING, both, because both genuinely arrive. The retired node declared
      # `object` and shipped an array in its own test fixture, which nothing checked; here
      # the fixture is validated against this schema, so the declaration has to be true.
      # One typed URL is a string, a list from an upstream node is an array.
      type: [array, string]
      title: URLs
      description: >-
        URL or array of URLs to extract from. Use `return signal.<id>.<handle>.<field>` to
        take them from an upstream node.
      "ui:field": template
    prompt:
      type: string
      title: Extraction Prompt
      description: Natural-language description of what to extract
      "ui:field": template
    schema:
      type: object
      title: JSON Schema
      description: Optional JSON schema describing the shape to extract. Use `return { ... }`
      "ui:field": template
    # ── session controls, as /web/fetch takes them ────────────────────────────────
    useStealth:
      type: boolean
      title: Stealth Mode
      description: Apply anti-bot fingerprinting to look like a real browser
      default: true
      "ui:widget": toggle
    useUltraStealth:
      type: boolean
      title: Ultra Stealth
      description: Maximum anti-detection profile. Slower, so use it only when stealth is blocked
      default: false
      "ui:widget": toggle
    solveCaptchas:
      type: boolean
      title: Solve CAPTCHAs
      description: Automatically solve CAPTCHAs encountered during the session
      default: false
      "ui:widget": toggle
    country:
      type: string
      title: Location Country
      description: ISO country code to load the page from, e.g. US, GB, FR
      placeholder: US

    # WHO MAY RUN THIS BOX, set by whoever builds the workflow (15-who-can-run-it.md).
    #
    # INSTANCE config, not the manifest's `auth`, and the two answer different questions.
    # The manifest is the node author's FLOOR: "this node is inherently privileged". These
    # are the builder's, per box on the canvas, because the same node type legitimately
    # faces staff on one workflow and customers on another.
    #
    # A role especially has to live here: `finance:approve` is a claim THIS deployment's
    # identity provider mints, and a node published to the marketplace cannot know the role
    # vocabulary of every universe that installs it.
    #
    # The executor takes the STRICTER of the two. Neither can loosen the other.
    authRequired:
      type: boolean
      title: Require sign-in
      description: >-
        Only a signed-in caller may run this step. Leave off and it runs for whoever the
        workflow's trigger admitted, which is the usual answer.
      default: false
      "ui:widget": toggle
    authRole:
      type: string
      title: Require role
      description: >-
        A claim the caller's account must carry, as noun:verb (finance:approve,
        payments:refund). Leave blank to require only that they are signed in.
      default: ""
      "ui:dependencies": { authRequired: true }

"ui:order": [urls, prompt, schema, useStealth, useUltraStealth, solveCaptchas, country, authRequired, authRole]
