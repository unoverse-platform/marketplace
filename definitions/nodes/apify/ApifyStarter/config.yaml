$schema: ../../../_schema/config.schema.json

configSchema:
  type: object
  required: [actorId, urls]
  properties:
    actorId:
      type: string
      title: Actor or Task ID
      description: >-
        An actor id such as apify/web-scraper, or a saved task id such as
        username~my-scraper-task. A tilde means it is a task, which is a different endpoint.
      default: ""
      placeholder: username~my-scraper-task
    urls:
      # Both, because both arrive: a hand-typed JSON array is a string, and an upstream
      # node's output is a real array.
      type: [array, string]
      title: URLs to Scrape
      description: >-
        The URLs to hand to the run, as a JSON array. Use `return signal.<id>.<handle>` to
        take them from an upstream node.
      default: "[]"
      "ui:field": template
    # THESE TWO USED TO BE A LIE. The retired executor logged "Wait for completion not yet
    # implemented, returning run ID immediately" and returned anyway, so the toggle sat on
    # the panel doing nothing. They are kept rather than deleted because saved workflows
    # already carry them, and they now do what they say: a second call follows the run.
    waitForCompletion:
      type: boolean
      title: Wait for Completion
      description: >-
        Hold the node until the run finishes, so downstream steps start on finished data.
        Off hands back the run id immediately and something later has to check.
      default: false
      "ui:widget": toggle
    maxWaitTime:
      type: number
      title: Max Wait Time (seconds)
      description: How long to wait before giving up on the run
      default: 300
      minimum: 5
      maximum: 3600
      "ui:dependencies": { waitForCompletion: true }

    # WHO MAY RUN THIS BOX, set by whoever builds the workflow (15-who-can-run-it.md).
    #
    # INSTANCE config, not the manifest's `auth`, and the two answer different questions.
    # The manifest is the node author's FLOOR: "this node is inherently privileged". These
    # are the builder's, per box on the canvas, because the same node type legitimately
    # faces staff on one workflow and customers on another.
    #
    # A role especially has to live here: `finance:approve` is a claim THIS deployment's
    # identity provider mints, and a node published to the marketplace cannot know the role
    # vocabulary of every universe that installs it.
    #
    # The executor takes the STRICTER of the two. Neither can loosen the other.
    authRequired:
      type: boolean
      title: Require sign-in
      description: Only signed-in callers can run this step.
      default: false
      "ui:widget": toggle
    authRole:
      type: string
      title: Require role
      description: A claim the caller must carry, like finance:approve.
      default: ""
      "ui:dependencies": { authRequired: true }

"ui:order": [authRequired, authRole, actorId, urls, waitForCompletion, maxWaitTime]
