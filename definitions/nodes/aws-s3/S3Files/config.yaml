$schema: ../../../_schema/config.schema.json

configSchema:
  type: object
  required: [bucket]
  properties:
    bucket:
      type: string
      title: S3 Bucket
      description: The bucket to list
      default: ""
      "ui:field": template
    prefix:
      type: string
      title: Prefix
      description: Only list keys starting with this, e.g. invoices/2026/
      default: ""
      "ui:field": template
    maxKeys:
      type: number
      title: Max Files
      description: Most files to return
      default: 1000
      minimum: 1
      maximum: 1000
    fileExtensions:
      type: array
      title: File Extensions
      description: Only keep these extensions, e.g. pdf, csv. Empty keeps everything.
      default: []
    generatePresignedUrls:
      type: boolean
      title: Generate Links
      description: >-
        Mint a temporary download link per file, so a later step can fetch it without AWS
        credentials. Anyone holding a link has the file until it expires.
      default: false
      "ui:widget": toggle
    presignedUrlExpiry:
      type: number
      title: Link Lifetime (seconds)
      description: How long each link stays valid
      default: 3600
      minimum: 60
      maximum: 604800
      "ui:dependencies": { generatePresignedUrls: true }

    # WHO MAY RUN THIS BOX, set by whoever builds the workflow (15-who-can-run-it.md).
    #
    # INSTANCE config, not the manifest's `auth`, and the two answer different questions.
    # The manifest is the node author's FLOOR: "this node is inherently privileged". These
    # are the builder's, per box on the canvas, because the same node type legitimately
    # faces staff on one workflow and customers on another.
    #
    # A role especially has to live here: `finance:approve` is a claim THIS deployment's
    # identity provider mints, and a node published to the marketplace cannot know the role
    # vocabulary of every universe that installs it.
    #
    # The executor takes the STRICTER of the two. Neither can loosen the other.
    authRequired:
      type: boolean
      title: Require sign-in
      description: Only signed-in callers can run this step.
      default: false
      "ui:widget": toggle
    authRole:
      type: string
      title: Require role
      description: A claim the caller must carry, like finance:approve.
      default: ""
      "ui:dependencies": { authRequired: true }

"ui:order": [bucket, prefix, maxKeys, fileExtensions, generatePresignedUrls, presignedUrlExpiry, authRequired, authRole]
