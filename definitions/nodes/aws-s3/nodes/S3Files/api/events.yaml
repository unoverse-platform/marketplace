# One row per output connector, in interface.yaml order.
#
# Both rows come from `shared/files.yaml`, which is where the filtering, the id derivation
# and the link pairing live. They are shared because `presign.for` needs the identical list
# in the identical order, and a second copy could drift out of step with it.

- emit: files
  from: response
  value: { $ref: files#files }

- emit: count
  from: response
  value: { $ref: files#count }

- emit: root
  from: response
  value: { $ref: files#root }
