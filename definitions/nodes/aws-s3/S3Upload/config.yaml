$schema: ../../../_schema/config.schema.json

configSchema:
  type: object
  required: [bucket, key, sourceType]
  properties:
    bucket:
      type: string
      title: S3 Bucket
      description: The bucket to write the object into
      default: ""
      "ui:field": template
    key:
      type: string
      title: S3 Key
      description: The path to write it at, including the file name and extension
      default: ""
      "ui:field": template
    sourceType:
      type: string
      title: Source Type
      description: Whether to pull the bytes from a url or take base64 already in hand
      enum: [url, base64]
      enumNames: [URL, Base64 Data]
      default: base64
    sourceUrl:
      type: string
      title: Source URL
      description: The url to pull the file from
      default: ""
      "ui:field": template
      "ui:dependencies":
        sourceType: url
    base64Data:
      type: string
      title: Base64 Data
      description: The file as base64. A data URL prefix is stripped, and its type used.
      default: ""
      "ui:field": template
      "ui:dependencies":
        sourceType: base64
    contentType:
      type: string
      title: Content Type
      description: >-
        Overrides what the source said the file is. Leave empty to take it from the url's
        reply or the data URL's own prefix.
      default: ""
      "ui:field": template
    downloadUrlExpiry:
      type: number
      title: Link Lifetime (seconds)
      description: >-
        How long the download link stays valid. The retired node always used seven days,
        which is the maximum AWS allows; a day is usually plenty, and the link IS the
        credential.
      default: 86400
      minimum: 60
      maximum: 604800
"ui:order":
  [bucket, key, sourceType, sourceUrl, base64Data, contentType, downloadUrlExpiry]
