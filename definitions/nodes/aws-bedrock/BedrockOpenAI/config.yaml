$schema: ../../../_schema/config.schema.json

configSchema:
  type: object
  # `prompt` is required for the same reason it is on OpenAI: this node has nothing to do
  # without one, and requiring it moves the complaint from a vendor 400 to config
  # validation, where the canvas can show it.
  required: [model, prompt]

  properties:
    model:
      type: string
      title: Model
      description: Select the GPT model to use
      enum: { $ref: models#gpt/enum }
      enumNames: { $ref: models#gpt/enumNames }
      default: { $ref: models#gpt/default }
      # A retired id falls back to the current best model in its tier, so replacing a
      # model generation cannot break a saved workflow.
      resolve: modelTier

    maxTokens:
      type: number
      title: Max Tokens
      description: >-
        Hard ceiling on the reply. The model stops when it hits this, mid-sentence and
        without an error, so raise it for long output rather than leaving it to trim.
      default: 1200
      minimum: 1
      maximum: 128000

    systemPrompt:
      type: string
      title: System Prompt
      description: >-
        Standing instructions for every run: the model's role, tone and limits. Optional.
        Shared blocks work here, e.g. {{prompt.markdownGuidelines}}.
      default: ""
      ui:field: template

    prompt:
      type: string
      title: Prompt
      description: The request to answer. Usually wired in from an upstream node.
      default: ""
      ui:field: template

    # WHO MAY RUN THIS BOX, set by whoever builds the workflow (15-who-can-run-it.md).
    # INSTANCE config, not the manifest's `auth`. The executor takes the STRICTER of the
    # two; neither can loosen the other.
    authRequired:
      type: boolean
      title: Require sign-in
      description: Only signed-in callers can run this step.
      default: false
      "ui:widget": toggle
    authRole:
      type: string
      title: Require role
      description: A claim the caller must carry, like finance:approve.
      default: ""
      "ui:dependencies": { authRequired: true }

ui:order: [authRequired, authRole, model, maxTokens, systemPrompt, prompt]
