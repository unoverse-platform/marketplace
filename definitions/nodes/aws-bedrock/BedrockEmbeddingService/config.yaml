$schema: https://docs.unoverse.ai/schemas/nodes/config.schema.json

configSchema:
  type: object
  required: []
  properties:
    model:
      type: string
      title: Model
      enum: [amazon.titan-embed-text-v2:0, amazon.titan-embed-text-v1]
      enumNames: [Titan Text v2, Titan Text v1]
      default: amazon.titan-embed-text-v2:0
    dimensions:
      type: number
      title: Dimensions
      description: Vector length. Must match the store these vectors go into.
      enum: [1024, 512, 256]
      default: 1024
"ui:order": [model, dimensions]
