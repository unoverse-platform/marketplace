$schema: ../../../_schema/config.schema.json

configSchema:
  type: object
  required: [condition]
  properties:
    condition:
      type: object
      title: Condition
      description: >-
        An expression over the incoming data that decides the branch. Resolved before the node
        runs, so what arrives here is already true or false.
      default: ""
      "ui:field": template
"ui:order": [condition]
