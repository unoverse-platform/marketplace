$schema: ../../../_schema/interface.schema.json

inputs:
  - name: input
    type: object
    description: Output from the last node in the loop body. Reaching this node is what ends a pass.

# ONE DOT, and it is the one a builder actually wires. The next-iteration signal is NOT here:
# it is a `send` row in api/events.yaml addressed to the node named in `loopStartNodeId`, so the
# loop-back needs no connector and no edge (LOOP_NODES_SPEC.md). The pair still has no actor —
# re-entry is a delivery the platform performs, not the node reaching into the engine.
outputs:
  - name: done
    type: object
    description: "Emitted once the array is exhausted: { done, collected, total }"
