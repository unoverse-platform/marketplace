configSchema:
  type: object
  required: [loopStartNodeId]
  properties:
    loopStartNodeId:
      type: string
      title: Loop Start Node ID
      description: >-
        The paired LoopStart's node id, e.g. loopstart1. It identifies WHICH loop this closes, so
        two loops on one canvas cannot advance each other's index. Getting it wrong raises "loop
        state not found" rather than quietly closing the wrong loop.
    collect:
      type: object
      title: Collect
      description: >-
        Optional value to keep from each pass, e.g. {{ signal.openai1.text }}. An array is spread
        into separate entries rather than nested, so what arrives on `done` is one flat list.
      "ui:field": template
"ui:order": [loopStartNodeId, collect]
