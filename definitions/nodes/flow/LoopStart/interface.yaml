$schema: https://docs.unoverse.ai/schemas/nodes/interface.schema.json

inputs:
  - name: items
    type: array
    description: Array of items to iterate over

  # WHERE THE NEXT PASS ARRIVES, and it is not wired by hand. LoopEnd has no `continue` output to
  # wire: it addresses this node BY ID (`send: {{ config.loopStartNodeId }}` in its events table),
  # so the platform delivers here directly and there is no edge to draw or to leave dangling. On
  # that signal this node emits the item at the index LoopEnd just advanced.
  #
  # A separate connector rather than a flag on `items` because the two arrivals mean different
  # things: `items` opens a loop, `continue` resumes one.
  - name: continue
    type: signal
    signal: CONTINUE
    required: false
    description: "Internal: next-iteration signal from the paired LoopEnd (do not wire manually)"

# THESE THREE NAMES ARE AN ENGINE CONTRACT, not a preference. `executingState.ts` lifts item, index
# and total off any node whose type is literally "LoopStart" into `activeLoop`, and that is what makes
# {{ loop.item }} resolve for every node inside the loop body. Renaming one would leave the body's
# templates silently empty.
outputs:
  - name: item
    type: object
    description: Current item being processed
  - name: index
    type: number
    description: 0-based index of the current item
  - name: total
    type: number
    description: Total number of items in the array
