$schema: https://docs.unoverse.ai/schemas/nodes/config.schema.json

configSchema:
  type: object
  properties:
    items:
      type: object
      title: Items
      description: >-
        Array to loop through. A template, so it can be written over an upstream output instead of
        wiring the items connector. Whichever is set, config wins.
      "ui:field": template
"ui:order": [items]
