configSchema:
  type: object
  required: [content]
  properties:
    content:
      type: string
      title: Note Content
      description: Markdown shown on the canvas. Headings, lists, code blocks and emphasis all work.
      default: |
        # Note

        Add your documentation here...

        - Use markdown syntax
        - Add **bold** or *italic* text
        - Include `code` snippets
      # `ui:widget`, NOT `ui:field`. FieldRenderer.jsx branches on ui:field only for
      # `template` (:99) and `JSON` (:140); the multi-line box lives on ui:widget (:313).
      # Declaring `ui:field: textarea` lints clean against config.schema.json and falls
      # through to a single-line TextField — the same silent-fallthrough trap the
      # backgroundColor comment below describes.
      "ui:widget": textarea
      "ui:options":
        rows: 12
    backgroundColor:
      type: string
      title: Background Colour
      description: The colour of the sticky behind the text
      default: "#fffbeb"
      # NO `ui:widget: color`. The retired node declared one and the renderer has never
      # implemented it (FieldRenderer.jsx handles toggle/textarea/slider/checkboxes/
      # domainSelector), so it has always rendered as a plain text input. Naming it here would
      # lint clean and change nothing, which is worse than saying what it actually is.
    fontSize:
      type: number
      title: Font Size
      description: Base size for the note's text
      default: 14
      minimum: 10
      maximum: 24
"ui:order": [content, backgroundColor, fontSize]
