$schema: ../../../_schema/config.schema.json

configSchema:
  type: object
  required: [content]
  properties:
    content:
      type: string
      title: Note Content
      description: Markdown shown on the canvas. Headings, lists, code blocks and emphasis all work.
      default: |
        # Note

        Add your documentation here...

        - Use markdown syntax
        - Add **bold** or *italic* text
        - Include `code` snippets
      "ui:field": textarea
      "ui:options":
        rows: 10
    backgroundColor:
      type: string
      title: Background Colour
      description: The colour of the sticky behind the text
      default: "#fffbeb"
      # NO `ui:widget: color`. The retired node declared one and the renderer has never
      # implemented it (FieldRenderer.jsx handles toggle/textarea/slider/checkboxes/
      # domainSelector), so it has always rendered as a plain text input. Naming it here would
      # lint clean and change nothing, which is worse than saying what it actually is.
    fontSize:
      type: number
      title: Font Size
      description: Base size for the note's text
      default: 14
      minimum: 10
      maximum: 24

    # WHO MAY RUN THIS BOX, set by whoever builds the workflow (15-who-can-run-it.md).
    #
    # INSTANCE config, not the manifest's `auth`, and the two answer different questions.
    # The manifest is the node author's FLOOR: "this node is inherently privileged". These
    # are the builder's, per box on the canvas, because the same node type legitimately
    # faces staff on one workflow and customers on another.
    #
    # A role especially has to live here: `finance:approve` is a claim THIS deployment's
    # identity provider mints, and a node published to the marketplace cannot know the role
    # vocabulary of every universe that installs it.
    #
    # The executor takes the STRICTER of the two. Neither can loosen the other.
    authRequired:
      type: boolean
      title: Require sign-in
      description: Only signed-in callers can run this step.
      default: false
      "ui:widget": toggle
    authRole:
      type: string
      title: Require role
      description: A claim the caller must carry, like finance:approve.
      default: ""
      "ui:dependencies": { authRequired: true }

"ui:order": [authRequired, authRole, content, backgroundColor, fontSize]
