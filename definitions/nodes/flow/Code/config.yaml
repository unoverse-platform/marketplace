$schema: ../../../_schema/config.schema.json

configSchema:
  type: object
  required: [code]
  properties:
    code:
      type: object
      title: Code
      description: >-
        JS expression to transform data. It is a template field, so the ENGINE evaluates it before
        this node runs and what arrives here is already the finished value. That is why this node
        makes no request and does no computing of its own beyond the optional id hashes.
      default: ""
      "ui:field": template
    generateIds:
      type: boolean
      title: Generate IDs
      description: >-
        Also emit a universalId and a contentId derived from the value, for downstream dedup and
        ref hydration to join on.
      default: false
      "ui:widget": toggle
    saveToContext:
      type: boolean
      title: Save to Context
      description: >-
        Keep the value for the rest of this run, so a later node's template can reach it as
        {{ saved.<this node's id> }} without an edge.
      default: false
      "ui:widget": toggle

    # WHO MAY RUN THIS BOX, set by whoever builds the workflow (15-who-can-run-it.md).
    #
    # INSTANCE config, not the manifest's `auth`, and the two answer different questions.
    # The manifest is the node author's FLOOR: "this node is inherently privileged". These
    # are the builder's, per box on the canvas, because the same node type legitimately
    # faces staff on one workflow and customers on another.
    #
    # A role especially has to live here: `finance:approve` is a claim THIS deployment's
    # identity provider mints, and a node published to the marketplace cannot know the role
    # vocabulary of every universe that installs it.
    #
    # The executor takes the STRICTER of the two. Neither can loosen the other.
    authRequired:
      type: boolean
      title: Require sign-in
      description: Only signed-in callers can run this step.
      default: false
      "ui:widget": toggle
    authRole:
      type: string
      title: Require role
      description: A claim the caller must carry, like finance:approve.
      default: ""
      "ui:dependencies": { authRequired: true }

"ui:order": [authRequired, authRole, code, generateIds, saveToContext]
