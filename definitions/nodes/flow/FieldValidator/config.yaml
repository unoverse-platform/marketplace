$schema: ../../../_schema/config.schema.json

configSchema:
  type: object
  required: [requiredSchema, incomingData]
  properties:
    requiredSchema:
      type: object
      title: Required Schema
      description: >-
        The schema defining the fields to collect. Three shapes are accepted: a minted tool
        schema (inputSchema.json.properties), plain JSON Schema (properties/required), or a
        bare object whose keys are the field names. Example: return signal.toolSchema
      default: ""
      "ui:field": template
    incomingData:
      type: object
      title: Incoming Data
      description: >-
        The data gathered so far. A field counts as missing when absent, null or the empty
        string. Example: return signal.formData
      default: ""
      "ui:field": template
"ui:order": [requiredSchema, incomingData]
