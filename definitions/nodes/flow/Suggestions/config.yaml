$schema: ../../../_schema/config.schema.json

configSchema:
  type: object
  required: []
  properties:
    faqs:
      type: object
      title: FAQs
      description: >-
        Static FAQs, shown when the signal carries none. Authors may write strings,
        { text } or { question } items — all normalize to the template's { text } shape.
        Example: return signal.extractor.faqs
      default: ""
      "ui:field": template
    actions:
      type: object
      title: Actions
      description: Static actions, shown when the signal carries none.
      default: ""
      "ui:field": template
    recommendations:
      type: object
      title: Recommendations
      description: Static recommendations, shown when the signal carries none.
      default: ""
      "ui:field": template

    # WHO MAY RUN THIS BOX, set by whoever builds the workflow (15-who-can-run-it.md).
    # Instance config, not the manifest's `auth`: the manifest is the node author's floor,
    # these are the builder's per box, and the executor takes the stricter of the two.
    authRequired:
      type: boolean
      title: Require sign-in
      description: Only signed-in callers can run this step.
      default: false
      "ui:widget": toggle
    authRole:
      type: string
      title: Require role
      description: A claim the caller must carry, like finance:approve.
      default: ""
      "ui:dependencies": { authRequired: true }

"ui:order": [authRequired, authRole, faqs, actions, recommendations]
