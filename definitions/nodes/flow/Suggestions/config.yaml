$schema: ../../../_schema/config.schema.json

configSchema:
  type: object
  required: []
  properties:
    faqs:
      type: object
      title: FAQs
      description: >-
        Static FAQs, shown when the signal carries none. Authors may write strings,
        { text } or { question } items — all normalize to the template's { text } shape.
        Example: return signal.extractor.faqs
      default: ""
      "ui:field": template
    actions:
      type: object
      title: Actions
      description: Static actions, shown when the signal carries none.
      default: ""
      "ui:field": template
    recommendations:
      type: object
      title: Recommendations
      description: Static recommendations, shown when the signal carries none.
      default: ""
      "ui:field": template
"ui:order": [faqs, actions, recommendations]
