testData:
  config:
    query: AI agents lang:en -is:retweet
    maxResults: 10
    postFields: created_at,public_metrics,author_id,lang
  inputs:
    query: AI agents lang:en -is:retweet
  expect:
    tweets: "return output.tweets.length > 0 && typeof output.tweets[0].text === 'string' && typeof output.tweets[0].author.username === 'string'"
    resultCount: "return output.resultCount === output.tweets.length"
    raw: "return JSON.parse(output.raw).data.length === output.resultCount"
