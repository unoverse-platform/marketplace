# One call. The upstream `query` input wins over the configured one, which is what the
# retired executor did and what the input's description promises.

- name: search
  method: GET
  url: https://api.x.com/2/tweets/search/recent
  credential:
    scheme: bearer
    token: "{{ credentials.xCredential.bearerToken }}"
  query:
    query: >-
      return typeof signal.query === 'string' && signal.query.trim()
        ? signal.query.trim()
        : config.query
    # Clamped to the vendor's 10..100 rather than trusted: a saved workflow can hold
    # anything, and X rejects the request rather than clamping it for you.
    max_results: "return String(Math.min(Math.max(config.maxResults || 10, 10), 100))"
    # `post.fields`, the vendor's name since it renamed tweets to posts (docs.x.com,
    # search-recent-posts, checked 2026-10-10).
    post.fields: "return config.postFields || 'created_at,public_metrics,author_id,lang'"
    # WHO WROTE IT. Without the expansion a post names its author only by id; with it the
    # authors come back once each in `includes.users`, and events.yaml puts each on its posts.
    expansions: author_id
    user.fields: name,username,description,location,url,verified,public_metrics
  transport: json
  retry:
    attempts: 3
    backoff: exponential
    on: [429, 500, 502, 503, 504]
  # X reports a bad operator or an exhausted quota in the body with a 200 in some cases.
  error:
    when: "return !!response.errors && !response.data"
    message: "return response.errors.map(e => e.detail || e.title || e.message).join('; ')"
