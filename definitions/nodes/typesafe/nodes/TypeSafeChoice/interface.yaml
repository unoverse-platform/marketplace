inputs:
  - name: signal
    type: object
    description: Data from previous nodes
    required: false

outputs:
  - name: choice
    type: string
    description: The chosen option's key
  - name: probabilities
    type: object
    description: Each option's probability
  - name: confidence
    type: number
    description: 0 to 1, how clear the winner is
  - name: usage
    type: object
    description: model, inputTokens, outputTokens

credentials:
  - name: typesafeCredential
    required: true
    displayName: TypeSafe
