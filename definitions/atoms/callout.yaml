unoverse: "1.0"
kind: atom
name: callout
category: markdown
description: "An inline status message: an icon beside a title with an optional body line, on a soft bordered surface. Neutral by default; override background/border via the Ref's style with the status tones (status.success-subtle / success-border, warning, error) for a colored alert. Owns its full style — references tokens only."
whenToUse: "Strictly what a reader must not miss to avoid harm or real surprise, such as a deadline that forfeits something or a condition that voids cover. Never a routine qualifier: a fee's applicability, a notice period or a processing time belongs with the fact it qualifies. Also the in-place confirmation, warning or error on an interface (form feedback, action results)."
props:
  icon:
    type: string
    default: info
  title:
    type: string
    default: Something to know
  body:
    type: string
    default: ""
root:
  type: Box
  style:
    direction: row
    align: start
    gap: "3"
    width: full
    padding: "4"
    background: surface.sunken
    border: subtle
    radius: sm
  children:
    - type: Icon
      bind:
        name: icon
      style:
        flex: 0 0 auto
        width: "5"
        height: "5"
        color: text.secondary
    - type: Box
      style:
        direction: column
        gap: "1"
      children:
        - type: Text
          brief:
            description: The warning itself, in one line. State the consequence, not the topic.
            maxLength: 90
          bind:
            value: title
          style:
            font: body.md
            weight: semibold
            color: text.primary
        - type: Text
          brief:
            description: What the reader should do or know about it, from the source, as a COMPLETE sentence. If it will not fit, say less rather than stopping mid-sentence. Empty when the warning stands alone.
            optional: true
            maxLength: 320
          visibleWhen: body
          bind:
            value: body
          style:
            font: body.sm
            color: text.secondary
