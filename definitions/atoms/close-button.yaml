unoverse: "1.0"
kind: atom
name: close-button
description: "A circular close (✕) control — the floating dismiss for a focused widget or overlay: a surface-filled, bordered, shadowed icon button that reads on any background. Owns its full style; references tokens only."
whenToUse: The dismiss/close affordance on a focused component or modal, typically pinned to the top-right corner. Compose via a Ref; the host supplies the close action and the absolute placement.
root:
  type: Button
  # The default dismiss writes the public axis (`view`, STATE_MODEL v2 §2) back to
  # inline. In app chrome the SDK reads this as "un-surface" (isViewField accepts
  # both spellings during migration); component hosts override the action anyway.
  action:
    type: setValue
    values:
      - key: view
        value: inline
  style:
    flex: 0 0 auto
    cursor: pointer
    width: "8"
    height: "8"
    radius: full
    background: surface.base
    border: subtle
    shadow: sm
    direction: row
    align: center
    justify: center
    transition: all 150ms ease
    hover:
      background: surface.sunken
  children:
    - type: Icon
      icon: close
      style:
        width: "4"
        height: "4"
        color: text.secondary
