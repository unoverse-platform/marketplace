unoverse: "1.0"
type: atom
name: toggle-row
description: "A settings row with a switch: label and optional description on the left, a pill track on the right whose knob slides and fills with the brand color when the bound `on` field is true. Owns its full style — references tokens only."
whenToUse: An on/off setting or preference the user flips in place. Compose via a Ref, mapping label/description and binding on to the host field its action toggles; the host supplies the action.
props:
  label:
    type: string
    default: Setting
  description:
    type: string
    default: ""
  on:
    type: boolean
    default: false
root:
  type: Button
  action: toggle
  style:
    width: full
    direction: row
    align: center
    justify: space-between
    gap: "3"
    padding: "3"
    textAlign: start
    background: surface.base
    border: subtle
    radius: lg
    cursor: pointer
    transition: all 150ms ease
    hover:
      background: surface.sunken
  children:
    - type: Box
      style:
        direction: column
        flex: "1"
        minWidth: "0"
        gap: "1"
        align: start
      children:
        - type: Text
          bind:
            value: label
          style:
            font: body.md
            weight: semibold
            color: text.primary
        - type: Text
          visibleWhen: description
          bind:
            value: description
          style:
            font: body.sm
            color: text.secondary
    # The switch is its own atom, so the form field draws the same one. Extracted rather
    # than copied: two definitions of a control is how two controls start to differ.
    - type: Ref
      ref: toggle-switch
      props:
        on: on
