$schema: ../../_schema/unoverse.schema.json
unoverse: "1.0"
kind: atom
name: faq
category: markdown
description: "Question and answer pairs, each question set above its answer with a rule between pairs. Owns its full style, references tokens only."
whenToUse: Question and answer pairs the source states as such. Not a way to reframe ordinary copy as questions.
props:
  items:
    type: array
    default:
      - title: A question the source answers?
        body: The answer, in the source's own words.
root:
  type: Each
  brief:
    description: The question and answer pairs the source states AS SUCH. Never reframe ordinary copy as questions, and skip any pair whose answer merely restates its question.
    minItems: 2
    maxItems: 12
  bind:
    items: items
  style:
    direction: column
    gap: "4"
    width: full
  template:
    type: Box
    style:
      direction: column
      gap: "2"
      width: full
      padding: [ "0", "0", "4", "0" ]
      borderBottom: thin subtle
    children:
      - type: Text
        brief:
          description: The question, as a reader would ask it.
          maxLength: 120
        bind:
          value: title
        style:
          font: body.md
          weight: semibold
          color: text.primary
          lineHeight: snug
      - type: Text
        brief:
          description: The answer the source gives. Answer it; never restate the question.
          maxLength: 400
        visibleWhen: body
        bind:
          value: body
        style:
          font: body.md
          lineHeight: snug
          color: text.secondary
