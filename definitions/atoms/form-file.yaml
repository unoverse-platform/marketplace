unoverse: "1.0"
type: atom
name: form-file
category: markdown
description: "One collected document: a label, the platform's file chooser, and the name of whatever was chosen."
whenToUse: "Collect a document a person must provide: proof of identity, proof of address, a signed form, a statement. Not for a value they type, and not for a document the platform already holds."
# Same rules as form-text: remap `value` to the field's OWN key, and pass the label and
# help as literals via `with`.
#
# NO BRIEF, AND THERE NEVER WILL BE ONE. A model cannot choose a file: it has no access to
# the person's disk and nothing to propose. The field is theirs alone, which is the same
# rule that keeps a one-time code and a consent out of the schema.
#
# WHAT THE FIELD REPORTS IS THE CHOICE, NOT THE BYTES. The element hands back the file's
# name and size; where the bytes GO is an upload target and a stored reference, which is
# the workflow's business and not the renderer's.
props:
  label:
    type: string
    default: Label
    preview: Proof of address
  value:
    type: string
    default: ""
    preview: ""
  help:
    type: string
    default: ""
    preview: A utility bill or bank statement from the last three months.
  # Where a proposed value came from, in the reader's words: 'From your profile',
  # 'From the passport you uploaded'. Empty when nobody has proposed anything, which is
  # what makes an empty box and a suggestion look different.
  # WHETHER THE STEP CAN ADVANCE WITHOUT IT. Some answers are compulsory and some are not,
  # and a person deserves to know which before they start typing rather than when a button
  # refuses them. The resolver reads the same flag to decide when a step is complete.
  required:
    type: boolean
    default: false
    preview: true
  source:
    type: string
    default: ""
    preview: ""
root:
  type: Box
  style:
    direction: column
    gap: "1.5"
    width: full
  children:
    - type: Box
      style:
        direction: row
        align: center
        justify: space-between
        gap: "3"
        width: full
      children:
        - type: Box
          style:
            direction: row
            align: center
            gap: "1"
          children:
            - type: Text
              brief:
                description: >-
                  WHICH DOCUMENT is wanted, in the person's words: 'Proof of address',
                  'Signed subscription form'. Name the document the source actually
                  requires, never one you think would help.
                maxLength: 60
              bind:
                value: label
              style:
                font: label
                weight: medium
                color: text.secondary
            - type: Text
              visibleWhen: required
              value: "*"
              style:
                font: label
                weight: bold
                color: action.primary
        # The provenance chip. A proposed value is a suggestion until a person accepts it,
        # so the row says who suggested it rather than presenting it as already true.
        # It is the design system's pill, tinted, because a chip is a chip.
        - type: Ref
          ref: pill
          visibleWhen: source
          props:
            label: source
          style:
            background: action.subtle
    - type: Input
      inputType: file
      # THE PREFILL CHANNEL. A brief here compiles into the form's tool schema under the
      # field's OWN key, because the host remaps `value` before the schema is walked. That
      # is what lets a model propose a value at all. Per-field guidance belongs to the
      # authored form spec and reaches the schema through the compiler: an atom is one
      # file and cannot carry a different description for every field that composes it.
      # `value` is remapped by the host to the FIELD'S OWN key, which is what makes the
      # input write that key back: the input action writes `{ [boundField]: text }`.
      bind:
        value: value
      style:
        width: full
        font: body.md
        color: text.primary
        background: surface.base
        border: subtle
        radius: sm
        padding: [ "2", "3" ]
        minHeight: "10"
    - type: Text
      brief:
        description: >-
          What makes a document acceptable, when the source says: how recent it must be,
          whose name it must carry, which formats are allowed. Empty when the source sets
          no condition.
        optional: true
        maxLength: 160
      visibleWhen: help
      bind:
        value: help
      style:
        font: caption
        color: text.tertiary
