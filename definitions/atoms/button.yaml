$schema: ../../_schema/unoverse.schema.json
unoverse: "1.0"
kind: atom
name: button
description: Primary action button. Owns its full style — references tokens only (the theme's action colors carry the brand).
whenToUse: The standard call-to-action. Components COMPOSE this atom via a Ref node.
props:
  label:
    type: string
    default: Get Started
root:
  type: Button
  action: click
  style:
    display: inline-flex
    align: center
    justify: center
    cursor: pointer
    border: none
    font: button
    background: action.primary
    color: action.primary-text
    padding: [ "3", "6" ]
    minHeight: "10"
    radius: sm
  # The label is a CHILD, not a `bind` on the button itself: ButtonView renders
  # `bind.label` only while the node has NO children, and a Ref's `with` map turns a
  # bind into a hardcoded attribute — which that path never reads, so a literal label
  # rendered an empty button. As a child it works from `with` (literal) and from
  # `props` (field remap) alike.
  children:
    - type: Text
      bind:
        value: label
      style:
        font: button
        color: action.primary-text
