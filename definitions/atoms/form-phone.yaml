unoverse: "1.0"
kind: atom
name: form-phone
category: markdown
description: "One collected phone number: a label, the platform's phone keypad, and a chip naming where a proposed value came from."
whenToUse: "Collect a telephone number a person types or confirms, for a callback, a verification or a contact record. Not for a country dialling code on its own, which is a choice from a set."
# Same rules as form-text: remap `value` to the field's OWN key, and pass label,
# placeholder and help as literals via `with`.
#
# `inputType: tel` asks the platform for its phone keypad, and `autoComplete: tel` tells
# the browser what the field IS so it offers a saved number rather than guessing. Neither
# validates: a number's shape is a country's business, and a form that rejects a valid
# foreign number is worse than one that accepts an odd-looking one.
props:
  label:
    type: string
    default: Label
    preview: Phone number
  value:
    type: string
    default: ""
    preview: 7700 900123
  placeholder:
    type: string
    default: ""
    preview: e.g. 7700 900123
  help:
    type: string
    default: ""
    preview: An advisor will call this number, usually within one working day.
  # Where a proposed value came from, in the reader's words: 'From your profile',
  # 'From the passport you uploaded'. Empty when nobody has proposed anything, which is
  # what makes an empty box and a suggestion look different.
  # WHETHER THE STEP CAN ADVANCE WITHOUT IT. Some answers are compulsory and some are not,
  # and a person deserves to know which before they start typing rather than when a button
  # refuses them. The resolver reads the same flag to decide when a step is complete.
  required:
    type: boolean
    default: false
    preview: true
  source:
    type: string
    default: ""
    preview: From your profile
root:
  type: Box
  style:
    direction: column
    gap: "1.5"
    width: full
  children:
    - type: Box
      style:
        direction: row
        align: center
        justify: space-between
        gap: "3"
        width: full
      children:
        - type: Box
          style:
            direction: row
            align: center
            gap: "1"
          children:
            - type: Text
              bind:
                value: label
              style:
                font: label
                weight: medium
                color: text.secondary
            - type: Text
              visibleWhen: required
              value: "*"
              style:
                font: label
                weight: bold
                color: action.primary
        # The provenance chip. A proposed value is a suggestion until a person accepts it,
        # so the row says who suggested it rather than presenting it as already true.
        # It is the design system's pill, tinted, because a chip is a chip.
        - type: Ref
          ref: pill
          visibleWhen: source
          props:
            label: source
          style:
            background: action.subtle
    - type: Input
      inputType: tel
      autoComplete: "tel"
      # THE PREFILL CHANNEL. A brief here compiles into the form's tool schema under the
      # field's OWN key, because the host remaps `value` before the schema is walked. That
      # is what lets a model propose a value at all. Per-field guidance belongs to the
      # authored form spec and reaches the schema through the compiler: an atom is one
      # file and cannot carry a different description for every field that composes it.
      brief:
        description: >-
          Propose the number the person's profile actually holds, copied exactly, digits
          and spacing as stated. Never construct one from a country or an address, and
          leave it out when nothing states it: a wrong number is a call that never comes.
        optional: true
        maxLength: 32
      # `value` is remapped by the host to the FIELD'S OWN key, which is what makes the
      # input write that key back: the input action writes `{ [boundField]: text }`.
      bind:
        placeholder: placeholder
        value: value
      style:
        width: full
        font: body.md
        color: text.primary
        background: surface.base
        border: subtle
        radius: sm
        padding: [ "2", "3" ]
        minHeight: "10"
    - type: Text
      visibleWhen: help
      bind:
        value: help
      style:
        font: caption
        color: text.tertiary
