unoverse: "1.0"
kind: atom
name: form-email
category: markdown
description: "One collected email address: a label, an input the browser can autofill, a help line, and a chip naming where a proposed value came from."
whenToUse: "Collect an email address a person types or confirms. Not for a phone number, a name or any other contact detail."
# Same rules as form-text: remap `value` to the field's OWN key (the input writes
# `{ [boundField]: text }`), and pass label, placeholder and help as literals via `with`.
#
# `autoComplete: email` is a NODE ATTRIBUTE, so this is a sibling atom rather than a
# prop: it tells the browser what the field IS, which is what makes autofill offer the
# right value instead of guessing from the shape of the box.
props:
  label:
    type: string
    default: Label
    preview: Email address
  value:
    type: string
    default: ""
    preview: a.hartley@northbridge.example
  placeholder:
    type: string
    default: ""
    preview: you@example.com
  help:
    type: string
    default: ""
    preview: Confirmations and statements go here.
  # Where a proposed value came from, in the reader's words: 'From your profile',
  # 'From the passport you uploaded'. Empty when nobody has proposed anything, which is
  # what makes an empty box and a suggestion look different.
  # WHETHER THE STEP CAN ADVANCE WITHOUT IT. Some answers are compulsory and some are not,
  # and a person deserves to know which before they start typing rather than when a button
  # refuses them. The resolver reads the same flag to decide when a step is complete.
  required:
    type: boolean
    default: false
    preview: true
  source:
    type: string
    default: ""
    preview: From your profile
root:
  type: Box
  style:
    direction: column
    gap: "1.5"
    width: full
  children:
    - type: Box
      style:
        direction: row
        align: center
        justify: space-between
        gap: "3"
        width: full
      children:
        - type: Box
          style:
            direction: row
            align: center
            gap: "1"
          children:
            - type: Text
              bind:
                value: label
              style:
                font: label
                weight: medium
                color: text.secondary
            - type: Text
              visibleWhen: required
              value: "*"
              style:
                font: label
                weight: bold
                color: action.primary
        # The provenance chip. A proposed value is a suggestion until a person accepts it,
        # so the row says who suggested it rather than presenting it as already true.
        # It is the design system's pill, tinted, because a chip is a chip.
        - type: Ref
          ref: pill
          visibleWhen: source
          props:
            label: source
          style:
            background: action.subtle
    - type: Input
      # THE PREFILL CHANNEL. A brief here compiles into the form's tool schema under the
      # field's OWN key, because the host remaps `value` before the schema is walked. That
      # is what lets a model propose a value at all. Per-field guidance belongs to the
      # authored form spec and reaches the schema through the compiler: an atom is one
      # file and cannot carry a different description for every field that composes it.
      brief:
        description: >-
          Propose the email address the person's profile or an uploaded document actually
          states, copied exactly. Never construct one from a name and a company, and leave
          it out when nothing states it.
        optional: true
        maxLength: 120
      # `value` is remapped by the host to the FIELD'S OWN key, which is what makes the
      # input write that key back: the input action writes `{ [boundField]: text }`.
      autoComplete: email
      bind:
        placeholder: placeholder
        value: value
      style:
        width: full
        font: body.md
        color: text.primary
        background: surface.base
        border: subtle
        radius: sm
        padding: [ "2", "3" ]
        minHeight: "10"
    - type: Text
      visibleWhen: help
      bind:
        value: help
      style:
        font: caption
        color: text.tertiary
