unoverse: "1.0"
type: atom
name: form-long
category: markdown
description: "One collected passage: a label, a multi-line input, a help line, and a chip naming where a proposed value came from."
whenToUse: "Collect several sentences a person writes or confirms, such as a reason, a description or a note. Not for a single line, which fits a plain text field."
# Same rules as form-text: remap `value` to the field's OWN key (the input writes
# `{ [boundField]: text }`), and pass label, placeholder and help as literals via `with`.
#
# `multiline` and `rows` are NODE ATTRIBUTES the SDK reads directly, which is why this
# is a sibling atom rather than a prop on form-text: data cannot reach them.
props:
  label:
    type: string
    preview: Why are you applying?
    default: Label
  value:
    type: string
    description: >-
      Propose this passage only from what the source actually says, in the person's own
      words where they exist. Never write on their behalf to fill the box: this is a
      field they are expected to write themselves.
    maxLength: 600
    optional: true
    default: ""
  placeholder:
    type: string
    preview: A few sentences in your own words
    default: ""
  help:
    type: string
    preview: Two or three sentences is plenty.
  # Where a proposed value came from, in the reader's words: 'From your profile',
  # 'From the passport you uploaded'. Empty when nobody has proposed anything, which is
  # what makes an empty box and a suggestion look different.
  # WHETHER THE STEP CAN ADVANCE WITHOUT IT. Some answers are compulsory and some are not,
  # and a person deserves to know which before they start typing rather than when a button
  # refuses them. The resolver reads the same flag to decide when a step is complete.
    default: ""
  required:
    type: boolean
    preview: true
    default: false
  source:
    type: string
    default: ""
root:
  type: Box
  style:
    direction: column
    gap: "1.5"
    width: full
  children:
    - type: Box
      style:
        direction: row
        align: center
        justify: space-between
        gap: "3"
        width: full
      children:
        - type: Box
          style:
            direction: row
            align: center
            gap: "1"
          children:
            - type: Text
              bind:
                value: label
              style:
                font: label
                weight: medium
                color: text.secondary
            - type: Text
              visibleWhen: required
              value: "*"
              style:
                font: label
                weight: bold
                color: action.primary
        # The provenance chip. A proposed value is a suggestion until a person accepts it,
        # so the row says who suggested it rather than presenting it as already true.
        # It is the design system's pill, tinted, because a chip is a chip.
        - type: Ref
          ref: pill
          visibleWhen: source
          props:
            label: source
          style:
            background: action.subtle
    - type: Input
      # THE PREFILL CHANNEL. A brief here compiles into the form's tool schema under the
      # field's OWN key, because the host remaps `value` before the schema is walked. That
      # is what lets a model propose a value at all. Per-field guidance belongs to the
      # authored form spec and reaches the schema through the compiler: an atom is one
      # file and cannot carry a different description for every field that composes it.
      # `value` is remapped by the host to the FIELD'S OWN key, which is what makes the
      # input write that key back: the input action writes `{ [boundField]: text }`.
      multiline: true
      rows: 4
      autoComplete: "off"
      bind:
        placeholder: placeholder
        value: value
      style:
        width: full
        font: body.md
        color: text.primary
        background: surface.base
        border: subtle
        radius: sm
        padding: ["2", "3"]
        minHeight: "10"
    - type: Text
      visibleWhen: help
      bind:
        value: help
      style:
        font: caption
        color: text.tertiary
