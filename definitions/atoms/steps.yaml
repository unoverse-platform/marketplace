unoverse: "1.0"
kind: atom
name: steps
category: markdown
description: "An ordered sequence: a numbered marker beside each step's name, with an optional line of detail beneath it. Owns its full style, references tokens only."
whenToUse: A sequence the source states in order, where doing them out of order would be wrong, such as how to book, apply, register or claim something. Not for a list of unordered benefits or features, which is prose or a plain list.
props:
  items:
    type: array
    default:
      - title: Choose what you need
        body: The options are listed with what each includes.
      - title: Enter your details
        body: ""
      - title: Confirm
        body: A confirmation follows.
root:
  type: Each
  brief:
    description: The steps of the sequence, in the order the source gives them. Every step comes from the source, never inferred to round the list out.
    minItems: 2
    maxItems: 12
  bind:
    items: items
  style:
    direction: column
    gap: "4"
    width: full
  template:
    type: Box
    style:
      direction: row
      align: start
      gap: "4"
      width: full
    children:
      - type: Box
        style:
          flex: 0 0 auto
          # 6 is the marker that ALIGNS. The step's title is body.md at snug, a line box
          # of about 6; a marker of 8 stood taller than the line it sits beside, so the
          # column under it had to be nudged down by a quarter step to fake the match and
          # still landed off. At the same height as the line, both centres agree and the
          # nudge is gone.
          width: "6"
          height: "6"
          radius: full
          background: action.subtle
          direction: row
          align: center
          justify: center
        children:
          # `position` is the renderer's, not the content's: the sections carry no ordinal,
          # and a step that says which number it is would be presentation in the data.
          - type: Text
            bind:
              value: position
            style:
              font: body.sm
              weight: semibold
              color: action.primary
              # The marker centres its line BOX, and body.sm carries a 1.5 line-height, so
              # the half-line of leading below the digit pushed the glyph off the circle's
              # centre. `none` collapses the box onto the glyph, so centring centres what
              # is actually seen.
              lineHeight: none
      - type: Box
        style:
          direction: column
          gap: "1"
          flex: 1
          minWidth: "0"
        children:
          - type: Text
            brief:
              description: What the reader does, as an instruction in a few words. Start with the verb.
              maxLength: 60
            bind:
              value: title
            style:
              font: body.md
              weight: semibold
              color: text.primary
              lineHeight: snug
          - type: Text
            brief:
              description: One line of detail the source gives about this step, such as where to go or what arrives. Empty when the source says nothing beyond the step itself.
              optional: true
              maxLength: 160
            visibleWhen: body
            bind:
              value: body
            style:
              font: body.sm
              lineHeight: snug
              color: text.secondary
