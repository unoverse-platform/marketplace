unoverse: "1.0"
type: atom
name: form-otp
category: markdown
description: "A six-box one-time-code entry row: each box takes a single digit 0-9. The standard verification-code field. Owns its full style — references tokens only."
whenToUse: Entering a one-time passcode sent by SMS or email (transfer verification, sign-in, card activation). Compose via a Ref, remapping d1..d6 onto the six host fields the code is written into; the digits stay in the HOST's slice, so the host reads the assembled code.
# THE MODEL PLACES THIS FIELD; IT NEVER FILLS IT. The label and the help line carry briefs,
# so a document can decide that a one-time code is what belongs here and say what the code
# is for. The six digits carry NO brief and never will: they are not in the schema, so the
# code cannot be proposed, only typed by the person who was sent it.
#
# The six digits are the HOST's fields, remapped through `Ref props` — an atom expands
# into the host's tree, so a wizard that needs to submit the code can still read it.
# (A design-system COMPONENT would own its own slice and the code would be trapped there.)
props:
  label:
    type: string
    description: >-
      What the code is for, in the reader's words: 'Enter the code we sent to your
      phone'. Say where it was sent when the source states it, and never guess the
      channel.
    maxLength: 80
    preview: Enter the code we sent to your phone
    default: ""
  help:
    type: string
    description: >-
      One line of help the source gives about the code, such as how long it lasts or
      what to do if it does not arrive. Empty when the source says nothing.
    maxLength: 120
    optional: true
    preview: The code expires in 10 minutes.
    default: ""
  d1:
    type: string
    default: ""
  d2:
    type: string
    default: ""
  d3:
    type: string
    default: ""
  d4:
    type: string
    default: ""
  d5:
    type: string
    default: ""
  d6:
    type: string
    default: ""
root:
  type: Box
  style:
    direction: column
    align: center
    gap: "3"
    width: full
  children:
    - type: Text
      visibleWhen: label
      bind:
        value: label
      style:
        font: label
        weight: medium
        color: text.secondary
    - type: Box
      style:
        direction: row
        align: center
        justify: center
        gap: "2"
        width: full
      children:
      # `maxLength: 1` + `inputMode: numeric` are the constraint: one character, 0-9 only.
      # `advanceOnFill` moves focus on to the next box as each one fills.
      # `autoComplete: one-time-code` is what these fields ARE — without it the browser
      # guesses from the shape (a row of short numeric boxes) and offers to save the digits
      # as a card or ID number. Enforced by the Input primitive, so none of it drifts per host.
        - type: Input
          maxLength: 1
          inputMode: numeric
          advanceOnFill: true
          autoComplete: one-time-code
          bind:
            value: d1
          style:
            flex: 0 0 auto
            width: "16"
            height: "16"
            padding: "0"
            textAlign: center
            font: headline.lg
            weight: bold
            color: text.primary
            background: surface.base
            border: strong
            radius: md
            outline: none
        - type: Input
          maxLength: 1
          inputMode: numeric
          advanceOnFill: true
          autoComplete: one-time-code
          bind:
            value: d2
          style:
            flex: 0 0 auto
            width: "16"
            height: "16"
            padding: "0"
            textAlign: center
            font: headline.lg
            weight: bold
            color: text.primary
            background: surface.base
            border: strong
            radius: md
            outline: none
        - type: Input
          maxLength: 1
          inputMode: numeric
          advanceOnFill: true
          autoComplete: one-time-code
          bind:
            value: d3
          style:
            flex: 0 0 auto
            width: "16"
            height: "16"
            padding: "0"
            textAlign: center
            font: headline.lg
            weight: bold
            color: text.primary
            background: surface.base
            border: strong
            radius: md
            outline: none
        - type: Input
          maxLength: 1
          inputMode: numeric
          advanceOnFill: true
          autoComplete: one-time-code
          bind:
            value: d4
          style:
            flex: 0 0 auto
            width: "16"
            height: "16"
            padding: "0"
            textAlign: center
            font: headline.lg
            weight: bold
            color: text.primary
            background: surface.base
            border: strong
            radius: md
            outline: none
        - type: Input
          maxLength: 1
          inputMode: numeric
          advanceOnFill: true
          autoComplete: one-time-code
          bind:
            value: d5
          style:
            flex: 0 0 auto
            width: "16"
            height: "16"
            padding: "0"
            textAlign: center
            font: headline.lg
            weight: bold
            color: text.primary
            background: surface.base
            border: strong
            radius: md
            outline: none
        - type: Input
          maxLength: 1
          inputMode: numeric
          advanceOnFill: true
          autoComplete: one-time-code
          bind:
            value: d6
          style:
            flex: 0 0 auto
            width: "16"
            height: "16"
            padding: "0"
            textAlign: center
            font: headline.lg
            weight: bold
            color: text.primary
            background: surface.base
            border: strong
            radius: md
            outline: none
    - type: Text
      visibleWhen: help
      bind:
        value: help
      style:
        font: caption
        color: text.tertiary
