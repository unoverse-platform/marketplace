# The BROWSE arrangement: the director's set as a RESPONSIVE grid — column count per
# breakpoint band (served container widths, semantic/breakpoints): stacked on mobile,
# two across on tablet, three on desktop, four at full. The OUTER box is the
# measuring context (`container`): the bands read the width this arrangement actually
# has, wherever it is placed — a grid in a narrow rail stacks on a wide screen.
type: Box
style:
  width: full
  container: inline-size
children:
  - type: Box
    style:
      columns:
        mobile: "1"
        tablet: "2"
        desktop: "3"
        full: "4"
      gap: "4"
      width: full
      # The browse arrangement's own top breathing room — the mount frame
      # deliberately carries no top padding (it would break the page state's
      # sticky header).
      padding: [ "4", "0", "0", "0" ]
    children:
      # No `state:` pin: arrivals keep their own state, so the tap-to-detail dance
      # is free — a card writing itself into `page` activates that state by name.
      # The rule is UNIVERSAL wording (the reader's relevance, no client words) —
      # the shelf's sensible default. An org wanting bespoke judgment ships its
      # own template; the director's brain has ONE home, this section.
      - director:
          rules: The items most relevant to the user, strongest matches first.
          preview: [ card, card, card ]
