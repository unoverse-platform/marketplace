title: Voice Call
description: The live voice-call experience, the assistant's avatar and every step of a call on one surface.
whenToUse: Talk to the assistant on a live voice call and see the call itself, the assistant's face and orb, a button to start the call, and clear signs of who is speaking, when it is listening and when it is looking something up. It shows the whole call from resting to hung up. Not for the conversation transcript and not for typing a message, it renders the call and nothing else.
category: Communication
version: 1.0.0

# The app-level LOAD MODE (docs/design/03 §The manifest): absent, a component app
# would load in `focus`. Arrival inside a template is the tree's `initial` (call,
# the one public state); this key keeps the app load honest to it.
defaultState: call
