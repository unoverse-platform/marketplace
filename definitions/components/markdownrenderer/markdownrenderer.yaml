$schema: ../../../_schema/unoverse.schema.json
unoverse: "1.0"
kind: component
name: MarkdownRenderer
category: Content
nodeSize:
  width: 720
  height: 560
description: "Static markdown document renderer: an optional titled header with a streaming indicator, then a full markdown body (headings, lists, tables, code, links, images) or a waiting placeholder."
whenToUse: Render a whole markdown document or report — headings, lists, tables, code blocks, links and images — as static formatted prose, optionally under a document title with a writing indicator while it generates. Pick when the entire markdown body is shown as a standalone document, rather than a single conversational chat reply that streams token by token.
props:
  title:
    type: string
    default: Client Brief — Acme Co.
  markdown:
    type: string
    default: |
      # Client Brief — Acme Co.

      ## Summary

      Acme Co. is exploring a refreshed onboarding journey for SMB customers. The goal is to reduce time-to-activation from 11 days to under 5 days while preserving the white-glove feel of the existing process.

      ## Goals

      - Shorter first-value window
      - Fewer manual handoffs between Sales and CS
      - Clearer self-serve paths for low-complexity accounts

      ## Risks

      | Risk | Severity |
      | --- | --- |
      | Regulatory timing around KYC checks | High |
      | Data quality gaps in legacy CRM | Medium |
      | Change-management fatigue after Q1 | Medium |

      ## Next Steps

      1. Schedule a working session with CS leadership
      2. Audit existing onboarding telemetry
      3. Draft a revised journey map for review

      ---

      See [docs](https://example.com/onboarding) for prior art.
  streamingLabel:
    type: string
    default: Writing…
  placeholderText:
    type: string
    default: Waiting for document…
root:
  type: Box
  style:
    width: full
    direction: column
    gap: "3"
  children:
    - type: Box
      visibleWhen: title
      style:
        width: full
        direction: row
        align: center
        justify: space-between
        gap: "3"
        borderBottom: subtle
        padding: [ "0", "0", "2", "0" ]
      children:
        - type: Text
          bind:
            value: title
          style:
            font: headline.sm
            weight: semibold
            color: text.primary
        - type: Box
          visibleWhen: streaming
          style:
            direction: row
            align: center
            gap: sm
          children:
            - type: Box
              style:
                direction: row
                gap: xs
                align: center
              children:
                - type: Box
                  style:
                    width: "1.5"
                    height: "1.5"
                    background: action.primary
                    radius: full
                    animation:
                      name: wave
                      duration: 1.6s
                      easing: ease-in-out
                - type: Box
                  style:
                    width: "1.5"
                    height: "1.5"
                    background: action.primary
                    radius: full
                    animation:
                      name: wave
                      duration: 1.6s
                      easing: ease-in-out
                    animationDelay: 0.16s
                - type: Box
                  style:
                    width: "1.5"
                    height: "1.5"
                    background: action.primary
                    radius: full
                    animation:
                      name: wave
                      duration: 1.6s
                      easing: ease-in-out
                    animationDelay: 0.32s
            - type: Text
              bind:
                value: streamingLabel
              style:
                font: body.sm
                color: text.tertiary
    - type: Markdown
      visibleWhen: markdown
      bind:
        value: markdown
      style:
        width: full
        font: body.md
        color: text.primary
    - type: Text
      visibleWhen: empty
      bind:
        value: placeholderText
      style:
        width: full
        padding: [ "4", "0" ]
        font: body.sm
        color: text.tertiary
