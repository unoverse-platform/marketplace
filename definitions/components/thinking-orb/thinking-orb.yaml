unoverse: "1.0"
kind: component
name: thinking-orb
category: Feedback
description: A procedural thinking orb — a scan meridian sweeping a dotted globe, the assistant's "I'm on it" presence.
whenToUse: The thinking indicator for an AI surface — a procedural orb animation on its own, no chrome and no words. Set orbState to match the activity. For the same animation behind an assistant's face use avatar-orb; for three-dot typing feedback keep the wave dots.
props:
  orbState:
    type: string
    default: working
    enum: [working, searching, solving, listening, connecting, weaving, composing, breathing, shaping, halo, sonar, shimmer, pulse]
  speed:
    type: string
    default: "1"
  size:
    type: string
    default: "150"
  orbColor:
    type: string
    default: orb.ink-soft
    enum: [orb.ink-faint, orb.ink-soft, orb.ink, orb.brand]
root:
  type: Box
  style:
    align: center
    justify: center
    padding: "4"
  children:
    - type: Orb
      bind:
        state: orbState
        speed: speed
        size: size
      style:
        color: "{{orbColor}}"
