# ONE section, drawn by the atom its `kind` names, with its group label and heading above.
# Included by every body in document.yaml: the scroll, the lead and each tab.
type: Box
style:
  direction: column
  gap: "2"
  width: full
children:
  # The GROUP label, shown once where the group changes. An app cannot see the
  # section before it, so `groupStart` is derived where the sections are read and the
  # component simply honours it.
  - type: Text
    visibleWhen: groupStart
    bind:
      value: group
    style:
      font: eyebrow
      color: text.tertiary
  # The heading belongs to the DOCUMENT, not to each atom: every kind carries one, and
  # a section without a heading simply has none.
  - type: Text
    visibleWhen: heading
    bind:
      value: heading
    style:
      font: headline.sm
      weight: semibold
      color: text.primary
      lineHeight: tight
  - type: Switch
    on: kind
    cases:
      prose:
        type: Ref
        ref: prose
      steps:
        type: Ref
        ref: steps
      key-facts:
        type: Ref
        ref: key-facts
      list:
        type: Ref
        ref: list
      faq:
        type: Ref
        ref: faq
      fine-print:
        type: Ref
        ref: fine-print
      table:
        type: Ref
        ref: table
      callout:
        type: Ref
        ref: callout
      # A document may COLLECT, not only state. The kind is here so any document can carry
      # a field, the same way it carries a table.
      #
      # ⚠ A field drawn from a repeated section cannot write its own key back yet:
      # `setValue` writes the key verbatim and a controlled Input writes `{ [boundField]:
      # text }`, so every row of an Each would write the same one. Authored forms compile
      # to flat per-field nodes for exactly this reason (UNOVERSE_MCP_FORMS.md §3), and
      # this case renders the field until that compiler lands.
      form-dropdown:
        type: Ref
        ref: form-dropdown
      form-file:
        type: Ref
        ref: form-file
      form-phone:
        type: Ref
        ref: form-phone
      form-select:
        type: Ref
        ref: form-select
      form-text:
        type: Ref
        ref: form-text
      form-email:
        type: Ref
        ref: form-email
      form-number:
        type: Ref
        ref: form-number
      form-date:
        type: Ref
        ref: form-date
      form-long:
        type: Ref
        ref: form-long
      form-otp:
        type: Ref
        ref: form-otp
      form-toggle:
        type: Ref
        ref: form-toggle
      default:
        type: Ref
        ref: prose
