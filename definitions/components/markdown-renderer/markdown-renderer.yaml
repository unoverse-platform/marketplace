unoverse: "1.0"
type: component
name: markdown-renderer
category: Content
nodeSize:
  width: 720
  height: 560
description: "The Universal Markdown renderer: draws a markdown string (headings, lists, tables, code, links, images) or a typed-block document (prose, key facts, steps, lists, tables, fine print — tabbed when its groups call for it), under an optional titled header with a streaming indicator."
whenToUse: Render Universal Markdown, in either of its two forms. Given a markdown string it draws formatted prose; given typed blocks (sections) it draws the structured document, tabs and all. Any surface showing a record's body copy, a generated report or an agent's document uses this. Pick the streaming chat component instead only for a conversational reply streaming token by token.
props:
  title:
    type: string
    default: ""
    input: true
  markdown:
    type: string
    default: ""
    input: true
  streamingLabel:
    type: string
    default: Writing…
    input: true
  placeholderText:
    type: string
    default: Waiting for document…
    input: true
  # UNIVERSAL MARKDOWN, TYPED FORM — the block document. `sections` in reading order for
  # scroll mode; `toDocument` (base/markdown/document) shapes the tabbed fields when the
  # blocks carry 2+ groups. Tabs are addressed by POSITION because a Switch case is a
  # static name and a group label is whatever the source called it.
  sections:
    type: array
    input: true
    default:
      - kind: key-facts
        heading: At a glance
        facts:
          - label: Included
            value: "4"
            qualifier: per year
          - label: Network
            value: 200+
            qualifier: locations
      - kind: prose
        heading: What it is
        body: A passage of body copy, with **inline marks** and links.
      - kind: fine-print
        heading: ""
        body: Terms and conditions apply.
  tabbed:
    type: boolean
    default: false
    input: true
  lead:
    type: array
    default: []
    input: true
  tab0Label:
    type: string
    default: ""
    input: true
  tab0:
    type: array
    default: []
    input: true
  tab1Label:
    type: string
    default: ""
    input: true
  tab1:
    type: array
    default: []
    input: true
  tab2Label:
    type: string
    default: ""
    input: true
  tab2:
    type: array
    default: []
    input: true
  tab3Label:
    type: string
    default: ""
    input: true
  tab3:
    type: array
    default: []
    input: true
state:
  tab: "0"
root:
  type: Box
  style:
    width: full
    direction: column
    gap: "3"
  children:
    - type: Box
      visibleWhen: title
      style:
        width: full
        direction: row
        align: center
        justify: space-between
        gap: "3"
        borderBottom: subtle
        padding: [ "0", "0", "2", "0" ]
      children:
        - type: Text
          bind:
            value: title
          style:
            font: headline.sm
            weight: semibold
            color: text.primary
        - type: Box
          visibleWhen: streaming
          style:
            direction: row
            align: center
            gap: "2"
          children:
            - type: Box
              style:
                direction: row
                gap: "1"
                align: center
              children:
                - type: Box
                  style:
                    width: "1.5"
                    height: "1.5"
                    background: action.primary
                    radius: full
                    animation:
                      name: wave
                      duration: 1.6s
                      easing: ease-in-out
                - type: Box
                  style:
                    width: "1.5"
                    height: "1.5"
                    background: action.primary
                    radius: full
                    animation:
                      name: wave
                      duration: 1.6s
                      easing: ease-in-out
                    animationDelay: 0.16s
                - type: Box
                  style:
                    width: "1.5"
                    height: "1.5"
                    background: action.primary
                    radius: full
                    animation:
                      name: wave
                      duration: 1.6s
                      easing: ease-in-out
                    animationDelay: 0.32s
            - type: Text
              bind:
                value: streamingLabel
              style:
                font: body.sm
                color: text.tertiary
    - type: Markdown
      visibleWhen: markdown
      bind:
        value: markdown
      style:
        width: full
        font: body.md
        color: text.primary
    # The typed-block half of Universal Markdown: scroll mode is the sections in reading
    # order; tabbed mode is the toDocument shaping (lead above the strip, fine print on
    # every tab). Same drawing the retired document component carried, now living where
    # every markdown lives.
    - type: Switch
      visibleWhen: sections
      on: tabbed
      cases:
        "true":
          $include: components/tabbed
        default:
          type: Each
          bind:
            items: sections
          style:
            direction: column
            gap: "6"
            width: full
          template:
            $include: components/section
    - type: Text
      visibleWhen: empty
      bind:
        value: placeholderText
      style:
        width: full
        padding: [ "4", "0" ]
        font: body.sm
        color: text.tertiary
