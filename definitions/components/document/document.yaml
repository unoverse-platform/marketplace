unoverse: "1.0"
kind: component
name: document
category: Content
props:
  # SCROLL mode: every section in reading order.
  sections:
    type: array
    input: true
    default:
      - kind: key-facts
        heading: At a glance
        facts:
          - label: Included
            value: "4"
            qualifier: per year
          - label: Network
            value: 200+
            qualifier: locations
      - kind: prose
        heading: What it is
        body: A passage of body copy, with **inline marks** and links.
      - kind: fine-print
        heading: ""
        body: Terms and conditions apply.
  # TABBED mode: `toDocument` (base/markdown/document) decides which, and shapes these.
  # Tabs are addressed by POSITION because a Switch case is a static name and a group
  # label is whatever the source called it.
  tabbed:
    type: boolean
    default: false
    input: true
  lead:
    type: array
    default: []
    input: true
  tab0Label:
    type: string
    default: ""
    input: true
  tab0:
    type: array
    default: []
    input: true
  tab1Label:
    type: string
    default: ""
    input: true
  tab1:
    type: array
    default: []
    input: true
  tab2Label:
    type: string
    default: ""
    input: true
  tab2:
    type: array
    default: []
    input: true
  tab3Label:
    type: string
    default: ""
    input: true
  tab3:
    type: array
    default: []
    input: true
state:
  tab: "0"
root:
  type: Switch
  on: tabbed
  cases:
    "true":
      $include: components/tabbed
    default:
      type: Each
      bind:
        items: sections
      style:
        direction: column
        gap: "6"
        width: full
      template:
        $include: components/section
