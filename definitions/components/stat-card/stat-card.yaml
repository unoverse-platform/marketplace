unoverse: "1.0"
type: component
name: stat-card
category: Charts
nodeSize:
  width: 360
  height: 260
description: "Single hero KPI card: a label, a large headline value, a colour-coded period-over-period delta, and a compact bar trend. Composed from Box + Each + {{pct}}-bound bars (no chart primitive); delta sentiment (deltaPositive/deltaNegative/deltaNeutral) and the trend proportions are resolved by the data producer."
whenToUse: Spotlight ONE key metric on its own — a single big number with its change versus the prior period and a small trend. Pick for a single prominent statistic, rather than several metrics together (a grid) or a full comparison of categories (a bar chart).
props:
  label:
    type: string
    description: "What the number measures."
    default: Monthly Revenue
  value:
    type: string
    description: "The number itself, already formatted, with any currency or unit."
    default: $48,250
  deltaArrow:
    type: string
    description: "The arrow drawn beside the change. Follows the direction, not written by hand."
    default: ▲
  deltaValue:
    type: string
    description: "How far it moved, already formatted, usually a percentage."
    default: 12.4%
  deltaLabel:
    type: string
    description: "What the change is measured against, for example 'vs last month'."
    default: vs last month
  deltaPositive:
    type: boolean
    description: "True when the change is an improvement. Decides the delta's colour."
    default: true
  deltaNegative:
    type: boolean
    description: "True when the change is a decline. Decides the delta's colour."
    default: false
  deltaNeutral:
    type: boolean
    description: "True when the change is neither good nor bad. Decides the delta's colour."
    default: false
  trend:
    type: array
    description: "The sparkline behind the number, oldest first. Each entry carries pct, the bar's height."
    default:
      - pct: 40%
      - pct: 55%
      - pct: 48%
      - pct: 62%
      - pct: 58%
      - pct: 75%
      - pct: 70%
      - pct: 88%
      - pct: 82%
      - pct: 100%
root:
  type: Box
  style:
    width: full
    direction: column
    gap: "3"
    padding: "6"
    background: surface.base
    border: subtle
    radius: lg
    shadow: sm
  children:
    - type: Text
      bind:
        value: label
      style:
        font: label
        weight: medium
        color: text.secondary
    - type: Text
      bind:
        value: value
      style:
        font: headline.lg
        weight: semibold
        color: text.primary
    - type: Box
      style:
        direction: row
        align: center
        gap: "2"
      children:
        - type: Box
          style:
            direction: row
            align: center
            gap: "1"
            color: text.tertiary
            when:
              - field: deltaPositive
                eq: true
                apply:
                  color: status.success
              - field: deltaNegative
                eq: true
                apply:
                  color: status.error
          children:
            - type: Text
              bind:
                value: deltaArrow
              style:
                font: body.sm
            - type: Text
              bind:
                value: deltaValue
              style:
                font: body.sm
                weight: semibold
        - type: Text
          visibleWhen: deltaLabel
          bind:
            value: deltaLabel
          style:
            font: body.sm
            color: text.tertiary
    - type: Each
      bind:
        items: trend
      style:
        direction: row
        align: end
        gap: "1"
        width: full
        height: "10"
      template:
        type: Box
        style:
          flex: "1"
          height: "{{pct}}"
          background: action.subtle
          radiusTopLeft: sm
          radiusTopRight: sm
