unoverse: "1.0"
type: component
name: avatar-orb
category: Feedback
description: An assistant avatar whose face and surrounding orb both change with the live call phase.
whenToUse: The assistant's face on a live voice surface, where its activity should read at a glance — waiting for you, hearing you, or answering. Reads the platform's own callState, so a voice app gets every moment with nothing to wire; at rest it is just the face, and the orb appears when the call goes live. For an activity animation with no face use thinking-orb; for a person's photo in a list or a review use the avatar atom.
props:
  # LOCKED STATE, declared here only so Studio can drive the preview. `callState` is
  # projected into scope by the voice service (an app's `service: "voice"`), exactly
  # as the agent-avatar atom reads it; inside a voice app the projected value is
  # what this branches on and this default never applies. Never simulate it elsewhere.
  callState:
    type: string
    description: "Where the call is: idle, listening, speaking. Decides how the orb moves."
    default: idle
    enum: [idle, active, listening, speaking, thinking]
  size:
    type: string
    description: "The orb's width in pixels."
    default: "200"
  orbColor:
    type: string
    description: "The orb's colour, as a token name."
    default: orb.ink-soft
    enum: [orb.ink-faint, orb.ink-soft, orb.ink, orb.brand]
  speed:
    type: string
    description: "How fast the animation runs. 1 is normal."
    default: "1"
root:
  type: Box
  style:
    # THE FACE SIZES THIS BOX, the halo floats over it. That order matters: the halo is
    # absent at rest, so if IT were the in-flow child the box would collapse to its
    # padding the moment a call ended and the absolutely-placed face would spill over
    # whatever sits below. The face is the constant, so the face is the one in flow.
    # The padding reserves the halo's footprint (face + 2x the padding step, close to the
    # orb's own size), so the column keeps its spacing whether or not a call is live.
    display: inline-flex
    direction: row
    position: relative
    align: center
    justify: center
    padding: "12"
  children:
    # THE HALO — one orb animation per LIVE call phase. The mapping lives here, in the
    # ONE discriminant, because a definition holds no logic: `callState` is the platform's
    # vocabulary, the orb states are the primitive's.
    #
    # NO `default` CASE, deliberately: an unmatched Switch renders NOTHING, so before a
    # call — `idle`, or no callState in scope at all — there is no orb and no canvas, just
    # the face. The animation is the call being live; showing it at rest would announce an
    # activity that isn't happening, and would burn a rAF loop on every idle surface.
    - type: Switch
      on: callState
      cases:
        # Connected, nobody speaking: PRESENT and attentive, not busy. The calm aura —
        # the assistant is here and the floor is yours.
        active:
          type: Orb
          state: halo
          bind:
            speed: speed
            size: size
          style:
            position: absolute
            inset: "0"
            margin: auto
            color: "{{orbColor}}"
        # Rings arriving inward — the shape of sound reaching a listener.
        listening:
          type: Orb
          state: sonar
          bind:
            speed: speed
            size: size
          style:
            position: absolute
            inset: "0"
            margin: auto
            color: "{{orbColor}}"
        # Rings leaving outward — the shape of a voice carrying.
        speaking:
          type: Orb
          state: pulse
          bind:
            speed: speed
            size: size
          style:
            position: absolute
            inset: "0"
            margin: auto
            color: "{{orbColor}}"
        # Looking something up: nobody speaking, answer not ready. `shimmer` is the primitive's
        # considering motion and this is the phase it was drawn for; it sat unused because
        # callState had nowhere to hang it.
        thinking:
          type: Orb
          state: shimmer
          bind:
            speed: speed
            size: size
          style:
            position: absolute
            inset: "0"
            margin: auto
            color: "{{orbColor}}"
    # THE FACE — the circular frame is fixed chrome, so it lives on this box; only the
    # PORTRAIT changes, switched on the same discriminant. Centred over the halo with
    # inset + auto margins.
    - type: Box
      style:
        # relative + zIndex so this static box paints ABOVE its absolutely-placed sibling
        position: relative
        zIndex: "1"
        width: "28"
        height: "28"
        radius: full
        overflow: hidden
        background: surface.sunken
        shadow: lg
      children:
        - type: Switch
          on: callState
          cases:
            # Attentive, facing you — NOT the thinking pose, which looks away and reads
            # as distracted at the one moment the assistant should look most present.
            active:
              type: Image
              src: https://res.cloudinary.com/sonik/image/upload/v1786260874/gravity/waiting.jpg
              alt: The assistant, ready
              style:
                width: full
                height: full
                fit: cover
            listening:
              type: Image
              src: https://res.cloudinary.com/sonik/image/upload/v1786260875/gravity/listening.jpg
              alt: The assistant, listening
              style:
                width: full
                height: full
                fit: cover
            speaking:
              type: Image
              src: https://res.cloudinary.com/sonik/image/upload/v1786260874/gravity/responding.jpg
              alt: The assistant, responding
              style:
                width: full
                height: full
                fit: cover
            # The pose that looks away — which is exactly why `active` refuses it. Distracted
            # when the floor is yours, concentrating when the assistant has gone to find out.
            thinking:
              type: Image
              src: https://res.cloudinary.com/sonik/image/upload/v1786260874/gravity/thinking.jpg
              alt: The assistant, looking something up
              style:
                width: full
                height: full
                fit: cover
            default:
              type: Image
              src: https://res.cloudinary.com/sonik/image/upload/v1786260874/gravity/waiting.jpg
              alt: The assistant, waiting
              style:
                width: full
                height: full
                fit: cover
