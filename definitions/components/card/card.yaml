# $schema stripped on read — present for the editor only.

unoverse: "1.0"
type: component
name: card
category: Content
nodeSize:
  width: 480
  height: 700
description: "Upright, stacked single-item card: image on top, then heading, supporting text and a primary action. Two standard faces: grid (compact) and page (full detail)."
whenToUse: Present a single rich item as an upright stacked card — an image on top with a heading, supporting text and a primary action beneath it. Pick for one item shown on its own in a narrow column, rather than a wide side-by-side banner or a scrollable set of items.
props:
  title:
    type: string
    description: "The item's name, one line, under the image."
    input: true
    default: Lightsaber Combat Training
  description:
    type: string
    description: "One or two sentences saying what the item is. Plain text, never markdown."
    input: true
    default: Master the seven forms of lightsaber combat with guidance from Jedi Masters.
  image:
    type: string
    description: "The picture across the top of the card. A URL the platform can fetch."
    input: true
    default: https://res.cloudinary.com/sonik/image/upload/v1761403583/gravity/YodaPark/darth-vader-main_4560aff7.jpg
  callToAction:
    type: string
    description: "The words on the button, two to four of them, naming the action."
    input: true
    default: Begin Training
# THE STANDARD FACE VOCABULARY (ruled 2026-08-28, doc §5d): `grid` is the compact
# collection face, `page` the full detail face — universal names, so any card
# name-matches any holder's states with no mapping. The tile opens its own page (it
# writes its view); the page's ✕ writes it back. `default` falls to the grid markup
# so every existing use with no view in scope renders exactly as before.
# `page` carries a private `step` axis (detail → thanks) as the design-system
# demonstrator of sub-states: the CTA acknowledges on `thanks`, Back returns.
# Steps are this component's own business; the app never moves between them.
states:
  grid:
    layout: layouts/grid
  page:
    layout: layouts/page
    on: step
    states:
      detail:
        layout: layouts/page-detail
      thanks:
        layout: layouts/page-thanks
