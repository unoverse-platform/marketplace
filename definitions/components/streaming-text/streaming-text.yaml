$schema: ../../../_schema/unoverse.schema.json
unoverse: "1.0"
kind: component
name: streaming-text
category: Content
nodeSize:
  width: 750
  height: 400
description: "Streaming text: a markdown body (tables, links, images) that renders token-by-token as a node streams it, plus an optional thinking/progress line."
whenToUse: Default for text that streams in token-by-token, such as a chat-style AI reply. For a static rendered document or report use MarkdownRenderer.
props:
  streaming:
    type: boolean
    default: false
  thinking:
    type: string
    input: true
    default: ""
  # The MODEL'S OWN reasoning summary, streamed live from the agent's `reasoning`
  # connector — distinct from `thinking` (the narrator's customer-safe status line).
  # Markdown: the API writes bold section headers per summary part.
  reasoning:
    type: string
    input: true
    default: ""
  text:
    type: string
    input: true
    default: |
      ## How can I help?

      This is an **AI response** rendered from _markdown_ — it streams in token by token and supports rich formatting:

      - **Lists** and `inline code`
      - [Links](https://example.com) that open in a new tab
      - Tables and images

      | Feature | Supported |
      | --- | --- |
      | Markdown body | ✅ |
      | Streaming | ✅ |
  questions:
    type: object
    input: true
    default: []
root:
  type: Box
  style:
    direction: column
    gap: "2"
    width: full
  children:
    - type: Box
      visibleWhen: thinking
      style:
        direction: row
        align: center
        gap: "2"
        padding: [ "2", "0", "0", "0" ]
      children:
        - type: Box
          visibleWhen: streaming
          style:
            direction: row
            gap: "1"
            align: center
          children:
            - type: Box
              style:
                width: "1.5"
                height: "1.5"
                background: action.primary
                radius: full
                animation:
                  name: wave
                  duration: 1.6s
                  easing: ease-in-out
            - type: Box
              style:
                width: "1.5"
                height: "1.5"
                background: action.primary
                radius: full
                animation:
                  name: wave
                  duration: 1.6s
                  easing: ease-in-out
                animationDelay: 0.16s
            - type: Box
              style:
                width: "1.5"
                height: "1.5"
                background: action.primary
                radius: full
                animation:
                  name: wave
                  duration: 1.6s
                  easing: ease-in-out
                animationDelay: 0.32s
        - type: Markdown
          bind:
            value: thinking
          style:
            font: body.sm
            color: text.tertiary
    # The model's working notes, above the answer it produced them for. Quiet by
    # design: sunken, small, tertiary — present when streamed, absent otherwise.
    - type: Box
      visibleWhen: reasoning
      style:
        background: surface.sunken
        radius: lg
        padding: [ "2", "3" ]
        width: full
      children:
        - type: Markdown
          bind:
            value: reasoning
          style:
            font: body.sm
            color: text.tertiary
    - type: Box
      visibleWhen: text
      style:
        background: surface.sunken
        radius: 2xl
        radiusTopLeft: "0"
        padding: [ "2", "4" ]
        width: fit-content
        maxWidth: 78%
      children:
        - type: Markdown
          bind:
            value: text
          style:
            font: body.md
            color: text.primary
    - type: Each
      visibleWhen: questions
      bind:
        items: questions
      style:
        direction: column
        gap: "1"
        width: full
        margin: [ "2", "0", "0", "0" ]
      template:
        type: Button
        action: ask
        style:
          width: full
          direction: row
          align: center
          gap: "2"
          cursor: pointer
          background: transparent
          border: none
          radius: lg
          padding: [ "1.5", "3" ]
          transition: all 150ms ease
          hover:
            background: surface.sunken
        children:
          - type: Icon
            icon: chat
            style:
              flex: 0 0 auto
              width: "4"
              height: "4"
              color: status.info
          - type: Text
            bind:
              value: value
            style:
              font: body.sm
              color: text.secondary
