# THE FIGURE'S FUNCTIONS (docs/unoverse/data/objects/README.md 4b). A figure of a document (ruled
# 2026-09-11) shows the picture kept at read time, or is rendered from its page on request,
# the region its box names, on the platform's own document service: nothing is stored, and the
# picture goes to the screen, never into a model's context. A chart whose values a vision read
# found (docs/unoverse/data/documents/review.md) returns them as rows beside its picture.
getDetail:
  description: The figure's picture, kept at read time or rendered from its page and box, and a chart's values as rows.
  calls:
    # THE PICTURE KEPT AT READ TIME: a link to it, and the browser loads it.
    - name: stored
      node: S3FileContent
      when: "return !!row.content.pictureKey"
      config:
        bucket: "{{ row.content.bucket }}"
        key: "{{ row.content.pictureKey }}"
        includeContent: false
    # Drawn from the page only for a figure read before pictures were kept.
    - name: file
      node: S3FileContent
      when: "return !calls.stored && !!row.content.partId && !!row.content.key && !!row.content.page"
      config:
        bucket: "{{ row.content.bucket }}"
        key: "{{ row.content.key }}"
        includeContent: false
    - name: picture
      node: RenderDocument
      when: "return !calls.stored && !!row.content.partId && !!row.content.key && !!row.content.page"
      config:
        fileUrl: "{{ calls.file.file.downloadUrl }}"
        fileName: "return String(row.content.key).split('/').at(-1)"
        page: "{{ row.content.page }}"
        box: "return row.content.box ? JSON.stringify(row.content.box) : ''"
        dpi: 150
    - name: rows
      node: S3FileContent
      when: "return !!row.content.rowsKey"
      config:
        bucket: "{{ row.content.bucket }}"
        key: "{{ row.content.rowsKey }}"
        includeContent: true
  returns: >-
    return (() => {
      const t = calls.rows && calls.rows.file && calls.rows.file.content ? JSON.parse(calls.rows.file.content) : null;
      const rows = t && Array.isArray(t.rows) ? t.rows : [];
      const image = calls.stored && calls.stored.file ? { url: calls.stored.file.downloadUrl, mimeType: 'image/png' } : calls.picture ? calls.picture.image : null;
      return Object.assign({}, image ? { image: image } : {},
        rows.length ? { header: t.header || [], rows: rows, total: rows.length, matched: rows.length } : {});
    })()

# ON THE MAP LIKE EVERY ROW (page-store.md, one index, 2026-10-07), so listed like every row:
# the same function a need's rows offer, unchanged.
# EVERY ROW WHOSE FIELD HOLDS A VALUE. A question across rows ("which funds use this
# administrator?", "which managers are regulated here?") is a filter on the object's own fields,
# not a search: a search is ranked and cut off and answers with the rows it happened to rank.
# Asked of any row, it reads every row of that row's object in the org; the row it was called on
# says which object, and nothing more.
list:
  description: >-
    Every row of this kind whose own field holds a value, with that field and its citations: which
    funds use an administrator, which managers are regulated somewhere, which documents are of a
    type. A complete list, never ranked: for any question that asks which, how many or all of
    something with a property, call this on one row of that kind and answer from it, never from
    search rows.
  input:
    type: object
    required: [field, value]
    properties:
      field:
        type: string
        enum: props
        description: The field to look in, by its own name
      value:
        type: string
        description: >-
          What the field holds. Matched anywhere in the field, a list's members included, and
          regardless of case
  calls:
    - name: found
      node: DatasetQuery
      config:
        object: "return String(row.object_type || '')"
        org: "{{ row.org }}"
        where: "return [{ column: String(params.field), contains: String(params.value) }]"
        limit: 200
  returns:
    rows: "return (calls.found && calls.found.rows) || []"
    count: "return ((calls.found && calls.found.rows) || []).length"
