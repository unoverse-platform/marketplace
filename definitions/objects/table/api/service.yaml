# THE TABLE'S FUNCTIONS (docs/unoverse/data/objects/README.md 4b). A table is made by no
# function of its own: the pipeline writes it as a part of its document. Its detail is its
# rows, read from its own file in the store (a few kilobytes, never the whole document) and
# filtered here, so an Agent asking
# for the commodities rows gets those and not four hundred others.
#
#   params.where   a phrase: only the rows with a cell containing it, any case; when no row holds
#                  it and a column's header does (a class per column, 2026-10-12), every row with
#                  its label and that column only (always first: a class per column must never
#                  come back as every class, measured 2026-10-12, the Agent read another class's
#                  fee). Otherwise A SMALL TABLE (50 rows or fewer) COMES WHOLE,
#                  `where` or not (owner, 2026-10-12: a fund sheet opened for its ISIN hid the
#                  ongoing charge two rows up): the platform fixes the size, never the model
#   params.limit   how many rows at most; 200 when not said
#
# A TABLE THAT IS A PICTURE (2026-09-11, a ROKOS manager review: two tables pasted as images,
# no text in their region) has no rows to read. Its detail renders its region instead, so it
# can be seen; reading the picture into rows is a model's job, not this one's.
getDetail:
  description: The table's header and rows from the store, filtered by params.where and bounded by params.limit.
  input:
    type: object
    properties:
      where:
        type: string
        description: A word or phrase; in a table of more than 50 rows, only the rows with a cell containing it come back (Commodities, Crude, Financials). A smaller table comes whole.
      limit:
        type: number
        description: How many rows at most. 200 when not said.
  calls:
    - name: rows
      node: S3FileContent
      when: "return !!row.content.rowsKey"
      config:
        bucket: "{{ row.content.bucket }}"
        key: "{{ row.content.rowsKey }}"
        includeContent: true
    # THE PICTURE KEPT AT READ TIME, for a table read from a picture: the evidence, as a link.
    - name: stored
      node: S3FileContent
      when: "return !!row.content.pictureKey"
      config:
        bucket: "{{ row.content.bucket }}"
        key: "{{ row.content.pictureKey }}"
        includeContent: false
    - name: file
      node: S3FileContent
      when: >-
        return !calls.stored && !!row.content.page && !!row.source_url
          && !(calls.rows && calls.rows.file && (JSON.parse(calls.rows.file.content || '{}').rows || []).length)
      config:
        bucket: "{{ row.content.bucket }}"
        key: "return String(row.source_url).replace(/^s3:\\/\\/[^/]+\\//, '')"
        includeContent: false
    - name: picture
      node: RenderDocument
      when: "return !!calls.file"
      config:
        fileUrl: "{{ calls.file.file.downloadUrl }}"
        fileName: "return String(row.source_url).split('/').at(-1)"
        page: "{{ row.content.page }}"
        box: "return row.content.box ? JSON.stringify(row.content.box) : ''"
        dpi: 150
  returns: >-
    return (() => {
      const t = calls.rows && calls.rows.file && calls.rows.file.content ? JSON.parse(calls.rows.file.content) : {};
      const all = t.rows || [];
      const where = params && params.where ? String(params.where).toLowerCase() : '';
      const byRow = where ? all.filter(r => r.join(' ').toLowerCase().includes(where)) : all;
      const lines = (t.header || []).map(h => Array.isArray(h) ? h : [h]);
      const cols = where ? (lines[0] || []).map((c, i) => i).filter(i => i > 0 && lines.some(h => String(h[i] == null ? '' : h[i]).toLowerCase().includes(where))) : [];
      const pick = r => [r[0]].concat(cols.map(i => r[i]));
      const byColumn = !byRow.length && cols.length > 0;
      const whole = all.length <= 50;
      const hit = byColumn ? all.map(pick) : whole ? all : byRow;
      const limit = params && params.limit ? Number(params.limit) : 200;
      return Object.assign(
        { header: byColumn ? lines.map(pick) : (t.header || []), rows: hit.slice(0, limit), total: all.length, matched: byColumn ? all.length : byRow.length },
        calls.stored && calls.stored.file ? { image: { url: calls.stored.file.downloadUrl, mimeType: 'image/png' }, asPicture: !all.length } : calls.picture ? { image: calls.picture.image, asPicture: true } : {}
      );
    })()

# ON THE MAP LIKE EVERY ROW (page-store.md, one index, 2026-10-07), so listed like every row:
# the same function a need's rows offer, unchanged.
# EVERY ROW WHOSE FIELD HOLDS A VALUE. A question across rows ("which funds use this
# administrator?", "which managers are regulated here?") is a filter on the object's own fields,
# not a search: a search is ranked and cut off and answers with the rows it happened to rank.
# Asked of any row, it reads every row of that row's object in the org; the row it was called on
# says which object, and nothing more.
list:
  description: >-
    Every row of this kind whose own field holds a value, with that field and its citations: which
    funds use an administrator, which managers are regulated somewhere, which documents are of a
    type. A complete list, never ranked: for any question that asks which, how many or all of
    something with a property, call this on one row of that kind and answer from it, never from
    search rows.
  input:
    type: object
    required: [field, value]
    properties:
      field:
        type: string
        enum: props
        description: The field to look in, by its own name
      value:
        type: string
        description: >-
          What the field holds. Matched anywhere in the field, a list's members included, and
          regardless of case
  calls:
    - name: found
      node: DatasetQuery
      config:
        object: "return String(row.object_type || '')"
        org: "{{ row.org }}"
        where: "return [{ column: String(params.field), contains: String(params.value) }]"
        limit: 200
  returns:
    rows: "return (calls.found && calls.found.rows) || []"
    count: "return ((calls.found && calls.found.rows) || []).length"
