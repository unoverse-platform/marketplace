# THE DOCUMENT'S PUBLIC FUNCTIONS (docs/unoverse/data/objects/README.md 4b): each may be called
# from outside, by an Agent in Spatial when it finds a document, and by a component. The private make
# function is api/make.yaml.
#
#   getDetail    the row and a fresh link to the original; its words, by page (params.pages)

# A DOCUMENT IS READ BY ITS PAGES (page-store.md, ruled 2026-10-07): never a section, never an
# outline, never the whole document to an Agent. `pages` is answered by the engine from the page
# store (services/detail/pieces.ts openDetail) with only this function's link; `whole` is the
# parsed text, for the page store to keep pages from, never for an Agent.
getDetail:
  description: >-
    The row and a fresh link to the original file. With params.pages, the words of those pages
    (a need's or a page's page numbers) and the tables on them with their rows.
  # WHAT A CALLER PASSES (README 4b): the Agent's tool arguments beside the row's universal_id.
  input:
    type: object
    properties:
      pages:
        type: array
        items: { type: number }
        description: Page numbers to read (a need's or a page's pages). Each page's words, and the tables on those pages with their rows; 40 pages at most.
  calls:
    - name: parsed
      node: S3FileContent
      when: "return !!(params && params.whole === true) && !!row.content.parsedKey"
      config:
        bucket: "{{ row.content.bucket }}"
        key: "{{ row.content.parsedKey }}"
        includeContent: true
    - name: file
      node: S3FileContent
      config:
        bucket: "{{ row.content.bucket }}"
        key: "{{ row.content.key }}"
        includeContent: false
  returns: >-
    return Object.assign({}, row, { downloadUrl: calls.file.file.downloadUrl },
      calls.parsed && calls.parsed.file ? { text: calls.parsed.file.content } : {})
