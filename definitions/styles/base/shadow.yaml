$description: Elevation shadows. Seeded from tokens.css --shadow-*. Values are CSS box-shadow strings (multi-layer); native SDKs interpret to platform elevation.
shadow:
  $type: shadow
  sm:
    $value: 0 1px 3px rgba(0,0,0,0.04)
  md:
    $value: 0 2px 8px rgba(0,0,0,0.06), 0 1px 3px rgba(0,0,0,0.04)
  lg:
    $value: 0 8px 24px rgba(0,0,0,0.06), 0 1px 3px rgba(0,0,0,0.04)
  xl:
    $value: 0 16px 48px rgba(0,0,0,0.12), 0 4px 12px rgba(0,0,0,0.08)
  hover-md:
    $value: 0 4px 12px rgba(0,0,0,0.08), 0 2px 6px rgba(0,0,0,0.06)
  hover-lg:
    $value: 0 12px 32px rgba(0,0,0,0.08), 0 4px 12px rgba(0,0,0,0.06)
  hover-xl:
    $value: 0 20px 56px rgba(0,0,0,0.14), 0 8px 16px rgba(0,0,0,0.10)
  orb-glow:
    $value: 0 0 24px rgba(99,102,241,0.35), 0 0 64px rgba(99,102,241,0.18)
