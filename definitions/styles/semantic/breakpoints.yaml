$description: >-
  BREAKPOINTS, named and served. The width bands a responsive style map keys on
  (`columns: { mobile: "1", tablet: "2", ... }`): mobile is the BASE band (below
  tablet, no token needed), and each named threshold starts its band. They are
  CONTAINER widths, not viewport widths — a grid in a narrow panel on a wide screen
  is mobile-band, which is what SDUI needs. Values live here because the SDK owns
  none: an org that wants different bands overrides these tokens.
breakpoint:
  $type: dimension
  tablet:
    $description: 48rem / 768px — the band where side-by-side starts to work.
    $value: "48rem"
  desktop:
    $description: 80rem / 1280px — the full working-width band.
    $value: "80rem"
  full:
    $description: 96rem / 1536px — the widest band; beyond this nothing changes.
    $value: "96rem"
