$description: The thinking-orb layer fills — sphere-shaded radial gradients on the brand hue, alpha baked in (`opacity` is not a style key). SEMANTIC, not per-theme, so every org inherits them; the alphas are tuned to read luminous on light and dark surfaces alike. An org re-hues its orb by overriding these three tokens (per theme if it wants different light/dark values). Consumed as `background:` by the thinking-orb components.
color:
  $type: color
  orb:
    core:
      $value: radial-gradient(circle at 35% 30%, rgba(165,180,252,0.95), rgba(99,102,241,0.85) 45%, rgba(67,56,202,0.9) 100%)
    halo:
      $value: radial-gradient(circle, rgba(99,102,241,0.4), rgba(99,102,241,0.14) 55%, transparent 72%)
    accent:
      $value: radial-gradient(circle at 65% 65%, rgba(34,211,238,0.7), rgba(34,211,238,0.25) 45%, transparent 70%)
