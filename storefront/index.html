<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unoverse Marketplace</title>
<!--
  THE STOREFRONT. Owned by the marketplace, not by the platform (MARKETPLACE.md §4).

  This page is deployed by pushing to this repo. No universe is upgraded and Canvas is
  never rebuilt, which is the entire reason the browse experience lives here.

  SHOWING IS NOT INSTALLING. This page has no token, no database, and does not know which
  universe is looking at it. It names what it wants to its host and the host performs it:

    postMessage {type:"unoverse:install", kind, name}  →  host
    postMessage {type:"unoverse:install:result", ok}   ←  host

  Standalone (opened directly rather than framed) it is a readable catalogue with the
  actions absent, because there is nothing to install into.

  Styling is deliberately its own. This must render before a universe has installed
  anything, so it cannot depend on the design system it exists to hand out.
-->
<style>
  :root {
    color-scheme: light;
    --bg: #fafafc; --card: #fff; --line: #e9e9ef; --ink: #16161d; --dim: #6b6b7b;
    --accent: #0f9d76;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 3.5rem 1.5rem 2rem; text-align: center; }
  h1 { margin: 0 0 .4rem; font-size: 2.1rem; letter-spacing: -0.035em; }
  .sub { color: var(--dim); margin: 0; }
  main { max-width: 62rem; margin: 0 auto; padding: 0 1.5rem 5rem; }
  .search { display: block; width: 100%; max-width: 30rem; margin: 1.6rem auto 0;
            padding: .7rem 1rem; font: inherit; border: 1px solid var(--line);
            border-radius: 999px; background: var(--card); outline: none; }
  .search:focus { border-color: #c9c9d6; }
  h2 { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em;
       color: var(--dim); margin: 2.4rem 0 .7rem; }
  ul { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line);
       border-radius: 16px; background: var(--card); overflow: hidden; }
  li { display: flex; align-items: center; gap: 1rem; padding: .85rem 1.1rem;
       border-bottom: 1px solid #f2f2f6; }
  li:last-child { border-bottom: 0; }
  .name { font-weight: 600; letter-spacing: -0.012em; }
  .meta { color: var(--dim); font-size: 12.5px; margin-top: .1rem; }
  .desc { color: var(--dim); font-size: 13px; margin: .15rem 0 0;
          display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .grow { flex: 1; min-width: 0; }
  button { font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer;
           border: 0; border-radius: 9px; padding: .45rem 1rem; color: #fff;
           background: var(--accent); }
  button[disabled] { opacity: .55; cursor: default; }
  .held { color: var(--dim); font-size: 12px; font-family: ui-monospace, monospace; }
  .empty { color: var(--dim); text-align: center; padding: 3rem 0; }
  @media (prefers-color-scheme: dark) {
    :root { color-scheme: dark; --bg: #0f1115; --card: #16181e; --line: #262a33;
            --ink: #e9e9ef; --dim: #9a9aae; }
    li { border-bottom-color: #1e222a; }
  }
</style>
</head>
<body>
<header>
  <h1>Unoverse Marketplace</h1>
  <p class="sub" id="sub">Loading…</p>
  <input class="search" id="q" type="search" placeholder="Search the catalogue" aria-label="Search the catalogue">
</header>
<main id="out"></main>

<script>
// Framed by a host that can install, or opened on its own as a readable catalogue.
const FRAMED = window.parent !== window;
const KINDS = [
  ["node", "Nodes"], ["component", "Components"], ["atom", "Atoms"],
  ["skill", "Skills"], ["prompt-block", "Prompt blocks"], ["style", "Styles"],
  ["template", "Apps"], ["recipe", "Recipes"],
];
// A recipe is copied onto a canvas and belongs to that workflow from then on, so it is
// listed to be read and never offered as an install.
const INSTALLABLE = (kind) => kind !== "recipe";

let items = [];
const pending = new Map();

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const key = (i) => i.kind + "/" + i.name;

function render() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const match = (i) => !q || (i.title + " " + i.name + " " + (i.description || "") + " " + (i.pack || "")).toLowerCase().includes(q);
  const shown = items.filter(match);
  const out = document.getElementById("out");

  if (!shown.length) {
    out.innerHTML = '<p class="empty">Nothing matches that.</p>';
    return;
  }

  out.innerHTML = KINDS.map(([kind, label]) => {
    const of = shown.filter((i) => i.kind === kind);
    if (!of.length) return "";
    return `<h2>${label} · ${of.length}</h2><ul>` + of.map((i) => {
      const state = pending.get(key(i));
      const action = !FRAMED || !INSTALLABLE(i.kind)
        ? ""
        : state === "busy" ? '<button disabled>Adding…</button>'
        : state === "done" ? '<span class="held">added</span>'
        : state ? `<span class="held">${esc(state)}</span>`
        : `<button data-kind="${esc(i.kind)}" data-name="${esc(i.name)}">Add</button>`;
      const meta = [i.pack, i.category].filter(Boolean).map(esc).join(" · ");
      return `<li><div class="grow">
        <div class="name">${esc(i.title || i.name)}</div>
        ${meta ? `<div class="meta">${meta}</div>` : ""}
        ${i.description ? `<p class="desc">${esc(i.description)}</p>` : ""}
      </div>${action}</li>`;
    }).join("") + "</ul>";
  }).join("");
}

document.getElementById("q").addEventListener("input", render);

// The host owns the write. This page only ever names what it wants.
document.getElementById("out").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-kind]");
  if (!b) return;
  const kind = b.dataset.kind, name = b.dataset.name;
  pending.set(kind + "/" + name, "busy");
  render();
  parent.postMessage({ type: "unoverse:install", kind, name }, "*");
});

window.addEventListener("message", (e) => {
  const m = e.data;
  if (!m || m.type !== "unoverse:install:result") return;
  pending.set(m.kind + "/" + m.name, m.ok ? "done" : "failed");
  render();
});

fetch("catalogue.json")
  .then((r) => r.json())
  .then((d) => {
    items = d.items || [];
    document.getElementById("sub").textContent =
      `${items.length} items · release ${d.release}` + (FRAMED ? "" : " · open this inside Studio to install");
    render();
  })
  .catch(() => {
    document.getElementById("sub").textContent = "The catalogue could not be loaded.";
  });
</script>
</body>
</html>
